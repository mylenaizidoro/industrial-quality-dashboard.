<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PPM Interno - Curitiba</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #6a5acd; padding: 20px; color: #333; }
        .header { color: white; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .valor { font-size: 24px; font-weight: bold; margin-top: 10px; }
        canvas { background: white; padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header"><h1>PPM Interno - Dashboard de Qualidade</h1></div>
    
    <div class="grid">
        <div class="card"><h3>PPM ATUAL</h3><div id="ppm" class="valor">-</div></div>
        <div class="card"><h3>META PPM</h3><div id="meta" class="valor">-</div></div>
        <div class="card"><h3>PRODUZIDO</h3><div id="prod" class="valor">-</div></div>
        <div class="card"><h3>REFUGO</h3><div id="refugo" class="valor">-</div></div>
    </div>

    <canvas id="grafico"></canvas>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzqbL1U5RKs0N9LFxomtPnmTT6iEK2Bc7AxwmLHjGbHtWAngVNQ9IRvpHqwqSEQTxdjlg/exec';

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const i = data.ppm.length - 1;
                document.getElementById('ppm').innerText = data.ppm[i];
                document.getElementById('meta').innerText = data.meta[i];
                document.getElementById('prod').innerText = data.produzido[i];
                document.getElementById('refugo').innerText = data.refugo[i];

                new Chart(document.getElementById('grafico'), {
                    type: 'line',
                    data: {
                        labels: data.meses,
                        datasets: [
                            { label: 'PPM Realizado', data: data.ppm, borderColor: '#6a5acd', tension: 0.3 },
                            { label: 'Meta', data: data.meta, borderColor: '#ff6384', borderDash: [5, 5] }
                        ]
                    }
                });
            });
    </script>
</body>
</html>
