<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Indicador de Turnover (MOD vs MOI)</h2>
        <canvas id="graficoTurnover"></canvas>
    </div>

    <script>
        // Substitua pelo seu link do Web App
        const url = 'https://script.google.com/macros/s/AKfycbyRvvNLXVI2JGM2cYVPH_6k_05bCyMb65ftNhtR-wUbyN8HsjSHsTkzrl7BzLRhRcNFmQ/exec';

        async function montarDashboard() {
            const res = await fetch(url);
            const dados = await res.json();

            // Lógica: Criar arrays para cada categoria
            // Aqui filtramos o JSON vindo da planilha para separar por série
            const meses = ["jan-25", "fev-25", "mar-25", "abr-25", "mai-25", "jun-25", "jul-25", "ago-25"];
            
            const ctx = document.getElementById('graficoTurnover').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: meses,
                    datasets: [
                        { label: 'MOD - 1º Turno', data: [1,1,1,1,1,1,1,1], backgroundColor: '#4472c4', stack: 'MOD' },
                        { label: 'MOD - 2º Turno', data: [6,6,6,6,6,6,6,6], backgroundColor: '#ffc000', stack: 'MOD' },
                        { label: 'MOD - 3º Turno', data: [5,5,5,5,5,5,5,5], backgroundColor: '#ed7d31', stack: 'MOD' },
                        { label: 'MOI - 1º Turno', data: [2,2,2,2,2,2,2,2], backgroundColor: '#5b9bd5', stack: 'MOI' },
                        { label: 'MOI - 2º Turno', data: [7,7,7,7,7,7,7,7], backgroundColor: '#ffd966', stack: 'MOI' },
                        { label: 'MOI - 3º Turno', data: [5,5,5,5,5,5,5,5], backgroundColor: '#f4b084', stack: 'MOI' }
                    ]
                },
                options: {
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true }
                    }
                }
            });
        }

        montarDashboard();
    </script>
</body>
</html>
