<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff; }
    </style>
</head>
<body>
    <div style="width: 90%; margin: auto; padding: 20px;">
        <h1 style="text-align: center; color: #333;">TURNOVER PA > 180 DIAS</h1>
        <canvas id="meuGrafico"></canvas>
    </div>

<script>
    // URL inserida:
    const url = 'https://script.google.com/macros/s/AKfycbzmcVgGuyAtZug5fwl4DPPhJHqbcXjQcQEPpGIeuDDxmUBiNYgUSpIJvU3OAuwnt-M-_Q/exec';

    async function carregar() {
        try {
            const res = await fetch(url);
            const dados = await res.json();
            
            // Agrupa os valores de 'valor' por 'mes'
            const meses = [...new Set(dados.map(d => d.mes))];
            const totais = meses.map(m => dados.filter(d => d.mes === m).reduce((s, d) => s + d.valor, 0));

            new Chart(document.getElementById('meuGrafico'), {
                type: 'bar',
                data: {
                    labels: meses,
                    datasets: [
                        { 
                            label: 'Realizado', 
                            data: totais, 
                            backgroundColor: '#ff4081' 
                        },
                        { 
                            label: 'Meta', 
                            data: meses.map(() => 6), // Meta fixa em 6
                            type: 'line', 
                            borderColor: '#ff9800', 
                            borderDash: [5, 5], 
                            borderWidth: 2, 
                            pointRadius: 4,
                            fill: false 
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            max: 15 
                        } 
                    }
                }
            });
        } catch (error) {
            console.error("Erro ao carregar dados:", error);
        }
    }
    carregar();
</script>
</body>
</html>
