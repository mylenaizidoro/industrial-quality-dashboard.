<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico | Mylena Izidoro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --primary: #e74c3c; --secondary: #3498db; --accent: #27ae60; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        .dashboard-card { 
            background: white; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            margin-bottom: 25px; 
        }
        .header { border-bottom: 3px solid var(--dark); margin-bottom: 20px; padding-bottom: 10px; }
        h2 { margin: 0; color: var(--dark); font-size: 1.5rem; text-transform: uppercase; }
        p.subtitle { color: #7f8c8d; margin: 5px 0 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-card">
            <div class="header">
                <h2>Devoluções Acumuladas por Defeito X Turno</h2>
                <p class="subtitle">Análise Comparativa de Falhas por Período de Trabalho</p>
            </div>
            <!-- Definimos uma altura maior para caber todos os motivos lateralmente -->
            <canvas id="stackedChart" height="500"></canvas>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    
                    const motivos = [];
                    const dataTA = [];
                    const dataTB = [];
                    const dataTC = [];

                    // Conforme image_7994ad.png e image_83a700.jpg:
                    // Motivos: Coluna K (índice 10)
                    // TA: Coluna L (índice 11) | TB: Coluna M (índice 12) | TC: Coluna N (índice 13)
                    // Linhas de dados: da 4 (índice 3) até a 16 (índice 15)
                    for(let i = 3; i <= 15; i++) {
                        if(rows[i] && rows[i][10]) {
                            motivos.push(rows[i][10]); // Nome do defeito
                            dataTA.push(parseFloat(rows[i][11]) || 0);
                            dataTB.push(parseFloat(rows[i][12]) || 0);
                            dataTC.push(parseFloat(rows[i][13]) || 0);
                        }
                    }
                    renderStackedChart(motivos, dataTA, dataTB, dataTC);
                }
            });
        }

        function renderStackedChart(labels, ta, tb, tc) {
            const ctx = document.getElementById('stackedChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Turno TA', data: ta, backgroundColor: '#27ae60' }, // Verde
                        { label: 'Turno TB', data: tb, backgroundColor: '#3498db' }, // Azul
                        { label: 'Turno TC', data: tc, backgroundColor: '#f1c40f' }  // Amarelo
                    ]
                },
                options: {
                    indexAxis: 'y', // Barras horizontais para facilitar a leitura dos nomes
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, beginAtZero: true },
                        y: { stacked: true }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
