<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        .main-title { text-align: center; color: #2c3e50; margin: 10px 0; text-transform: uppercase; font-size: 24px; font-weight: bold; }
        
        .btn-group { text-align: center; margin-bottom: 15px; }
        .btn-export { padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1200px; margin: auto; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { grid-column: span 2; }
        
        .header { text-align: center; color: #2c3e50; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; font-size: 16px; }
        
        /* Estilo do Plano de Ação Fixo */
        .plano-container { background: #fff; border: 2px solid #2c3e50; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; box-sizing: border-box; border-radius: 4px; resize: vertical; }
        .btn-salvar { margin-top: 10px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<h1 class="main-title">INDICADORES DE QUALIDADE COPLAC CURITIBA</h1>
<div class="btn-group">
    <button class="btn-export" onclick="gerarPDF()">EXPORTAR PDF</button>
</div>

<div class="dashboard">
    <div class="container full-width">
        <h2 class="header">INDICADOR PPM INTERNO - ÚLTIMOS 12 MESES</h2>
        <canvas id="graficoPPM" height="100"></canvas>
    </div>

    <div class="container">
        <h2 class="header">AS PEÇAS QUE APRESENTARAM MAIS DEFEITOS NO MÊS</h2>
        <canvas id="graficoDefeitos" height="200"></canvas>
    </div>

    <div class="container">
        <h2 class="header">PPM POR SETOR</h2>
        <canvas id="graficoSetor" height="200"></canvas>
    </div>

    <!-- ÁREA FIXA DO PLANO DE AÇÃO -->
    <div class="container full-width plano-container">
        <h2 class="header">PLANO DE AÇÃO E ANÁLISES</h2>
        <textarea id="textoPlano" placeholder="Escreva aqui suas análises e ações corretivas..."></textarea>
        <button class="btn-salvar" onclick="salvarPlano()">SALVAR ANÁLISE</button>
    </div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbx5eihq6v75T79HB7HWhGfK23f4WSTsiE8cksqTlPCyuqLcFd88_KhYkvbBa5p7VCjLbA/exec';
    
    // Carregar o texto salvo ao iniciar
    window.onload = () => {
        const salvo = localStorage.getItem('planoAcaoCoplac');
        if (salvo) document.getElementById('textoPlano').value = salvo;
    };

    function salvarPlano() {
        const texto = document.getElementById('textoPlano').value;
        localStorage.setItem('planoAcaoCoplac', texto);
        alert("Análise salva com sucesso no navegador!");
    }

    // --- (Código dos gráficos permanece igual) ---
    Chart.register(ChartDataLabels);
    fetch(url).then(r => r.json()).then(data => {
        // [Inserir lógica dos gráficos aqui conforme seu script original]
    });

    function gerarPDF() {
        const opt = { margin: 2, filename: 'Relatorio_Qualidade.pdf', html2canvas: { scale: 2 } };
        html2pdf().set(opt).from(document.body).save();
    }
</script>
</body>
</html>
