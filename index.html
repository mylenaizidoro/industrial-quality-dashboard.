<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .dashboard-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1100px; margin: auto; }
        .header { margin-bottom: 20px; }
        .header h1 { color: #1a2a3a; font-size: 24px; margin: 0; }
        .header p { color: #7f8c8d; font-size: 14px; margin: 5px 0 0; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 30px; align-items: center; }
        .detalhamento { border-left: 4px solid #3498db; padding-left: 20px; background: #f8fbff; padding: 20px; border-radius: 0 10px 10px 0; }
        .detalhamento h3 { color: #3498db; font-size: 14px; text-transform: uppercase; margin-top: 0; }
        .detalhamento p { font-size: 13px; color: #555; line-height: 1.6; }
        canvas { width: 100% !important; height: 400px !important; }
        @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h1>PRODUÇÃO POR LOTE - COPLAC</h1>
        <p>Grupo Coplac | Performance</p>
    </div>

    <div class="main-layout">
        <div class="chart-area">
            <canvas id="chartPerformance"></canvas>
        </div>

        <div class="detalhamento">
            <h3>Detalhamento</h3>
            <p><strong>Lote mais Lançado:</strong> <span id="topLote">---</span></p>
            <p><strong>Total de Peças:</strong> <span id="totalPecas">---</span></p>
            <p>Frequência de lançamentos por lote identificada na linha de produção Renault.</p>
        </div>
    </div>
</div>

<script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv";

    async function carregarGrafico() {
        const response = await fetch(urlCSV);
        const text = await response.text();
        const linhas = text.split('\n').slice(1);

        let contagemLotes = {};
        let total = 0;

        linhas.forEach(linha => {
            const col = linha.split(',');
            if (col.length > 3) {
                const lote = col[3]?.trim();
                if (lote) {
                    contagemLotes[lote] = (contagemLotes[lote] || 0) + 1;
                    total++;
                }
            }
        });

        const labels = Object.keys(contagemLotes).slice(0, 12);
        const dados = Object.values(contagemLotes).slice(0, 12);
        
        // Lógica de cores baseada na imagem image_38dd95.png
        const cores = dados.map(v => v > 50 ? '#e74c3c' : '#2ecc71');

        document.getElementById('totalPecas').innerText = total.toLocaleString();
        const topLote = Object.keys(contagemLotes).reduce((a, b) => contagemLotes[a] > contagemLotes[b] ? a : b);
        document.getElementById('topLote').innerText = topLote;

        new Chart(document.getElementById('chartPerformance'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Realizado',
                    data: dados,
                    backgroundColor: cores,
                    borderRadius: 5,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#eee' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    carregarGrafico();
</script>

</body>
</html>
