<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Curitiba</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Design Industrial Limpo */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #eef2f5; padding: 30px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        
        .header { background: #6a5acd; color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Grid dos 4 Cards */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; border: 1px solid #ddd; }
        .card h3 { font-size: 0.85em; color: #777; margin: 0; text-transform: uppercase; }
        .valor { font-size: 1.6em; font-weight: bold; color: #333; margin: 10px 0; }
        
        /* Área do Gráfico */
        .chart-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PPM Interno - Dashboard de Qualidade</h1>
        <p>Grupo Coplac - Curitiba | Partes Por Milhão de Defeitos Internos</p>
    </div>

    <div class="grid">
        <div class="card"><h3>PPM ATUAL</h3><div class="valor" id="ppm">-</div></div>
        <div class="card"><h3>META PPM</h3><div class="valor" id="meta">-</div></div>
        <div class="card"><h3>PRODUZIDO</h3><div class="valor" id="prod">-</div></div>
        <div class="card"><h3>REFUGO</h3><div class="valor" id="refugo">-</div></div>
    </div>

    <div class="chart-box">
        <h3>Evolução PPM Interno</h3>
        <canvas id="grafico"></canvas>
    </div>
</div>

<script>
    // Link do seu Web App
    const url = 'https://script.google.com/macros/s/AKfycbzqbL1U5RKs0N9LFxomtPnmTT6iEK2Bc7AxwmLHjGbHtWAngVNQ9IRvpHqwqSEQTxdjlg/exec';

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const i = data.ppm.length - 1;
            document.getElementById('ppm').innerText = data.ppm[i];
            document.getElementById('meta').innerText = data.meta[i];
            document.getElementById('prod').innerText = data.produzido[i];
            document.getElementById('refugo').innerText = data.refugo[i];

            new Chart(document.getElementById('grafico'), {
                type: 'line',
                data: {
                    labels: data.meses,
                    datasets: [{
                        label: 'PPM Realizado',
                        data: data.ppm,
                        borderColor: '#6a5acd',
                        backgroundColor: 'rgba(106, 90, 205, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: { responsive: true }
            });
        });
</script>
</body>
</html>
