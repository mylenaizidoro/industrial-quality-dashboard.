<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .box { width: 48%; min-width: 400px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="box"><canvas id="graficoMOD"></canvas></div>
    <div class="box"><canvas id="graficoMOI"></canvas></div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbwT-NrLz9LS2SDag3YMcTrVkT5WJFoKNTv2U6dN82mpyfwJGCCzJva_GYvKLlhxx4DPmQ/exec';

    async function carregar() {
        const res = await fetch(url);
        const rawData = await res.json();

        // 1. Limpar e ordenar as datas (formatar "jan.-25")
        const meses = [...new Set(rawData.map(d => {
            const date = new Date(d.mes);
            return date.toLocaleDateString('pt-BR', {month: 'short'}) + ".-" + date.getFullYear().toString().slice(-2);
        }))].sort();

        function renderizar(id, tipo, titulo) {
            const series = ['1º TURNO', '2º TURNO', '3º TURNO', 'ADM'];
            const datasets = series.map((turno, i) => ({
                label: turno,
                data: meses.map(m => {
                    const item = rawData.find(d => {
                        const dDate = new Date(d.mes);
                        const dMes = dDate.toLocaleDateString('pt-BR', {month: 'short'}) + ".-" + dDate.getFullYear().toString().slice(-2);
                        return dMes === m && d.categoria === (tipo + " - " + turno);
                    });
                    return item ? item.qtd : 0;
                }),
                backgroundColor: ['#4472c4', '#ffc000', '#ed7d31', '#a5a5a5'][i]
            }));

            new Chart(document.getElementById(id), {
                type: 'bar',
                data: { labels: meses, datasets },
                options: {
                    plugins: { title: { display: true, text: titulo } },
                    scales: { y: { stacked: true, beginAtZero: true } }
                }
            });
        }

        renderizar('graficoMOD', 'MOD', 'Turnover MOD');
        renderizar('graficoMOI', 'MOI', 'Turnover MOI');
    }
    carregar();
</script>
</body>
</html>
