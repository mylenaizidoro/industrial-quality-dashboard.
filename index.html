<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff; }
    </style>
</head>
<body>
    <div style="width: 90%; margin: auto; padding: 20px;">
        <h1 style="text-align: center; color: #333;">TURNOVER PA > 180 DIAS</h1>
        <canvas id="meuGrafico"></canvas>
    </div>

<script>
    // URL inserida corretamente:
    const url = 'https://script.google.com/macros/s/AKfycbydDFGSC2CA_8XndZZr_yd3lD1Qu-xf-JX3b5uqjS3qJ5mM4z-IyT9vKtUCBgNUzdlTIw/exec';

    async function carregar() {
        const res = await fetch(url);
        const dados = await res.json();
        
        // Agrupa valores por mês
        const meses = [...new Set(dados.map(d => d.mes))];
        const totais = meses.map(m => dados.filter(d => d.mes === m).reduce((s, d) => s + d.valor, 0));

        new Chart(document.getElementById('meuGrafico'), {
            type: 'bar',
            data: {
                labels: meses,
                datasets: [
                    { label: 'Realizado', data: totais, backgroundColor: '#ff4081' },
                    { label: 'Meta', data: meses.map(() => 6), type: 'line', borderColor: '#ff9800', borderDash: [5, 5], borderWidth: 2, pointRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, max: 15 } }
            }
        });
    }
    carregar();
</script>
</body>
</html>
