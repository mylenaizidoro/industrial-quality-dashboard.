<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>KPI Qualidade - Mylena (Setor Automotivo)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #e74c3c; padding-bottom: 10px; }
        .meta { font-size: 0.9em; color: #7f8c8d; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Indicador de Devoluções PIC (%)</h2>
        <p class="meta">Monitoramento em Tempo Real - Rastreabilidade por Lote e Turno</p>
        <canvas id="picChart"></canvas>
    </div>

    <script>
        // Link CSV do seu Google Sheets
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pubhtml?gid=1564773237&single=true&output=csv';

        async function updateDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    
                    // Filtrar linhas vazias e pegar Desc. Motivo e Quant.
                    const filteredData = data.filter(row => row['Desc. Motivo'] && row['Quant.']);
                    
                    const labels = filteredData.map(row => row['Desc. Motivo']);
                    const values = filteredData.map(row => {
                        const devolvida = parseFloat(row['Quant.']);
                        // Aplicando sua fórmula: (Devolvida / Total Lote) * 100
                        // Usando 1000 como base padrão para o Lote PIC
                        const totalLote = 1000; 
                        return ((devolvida / totalLote) * 100).toFixed(2);
                    });

                    renderChart(labels, values);
                }
            });
        }

        function renderChart(labels, values) {
            const ctx = document.getElementById('picChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '% de Rejeição por Defeito',
                        data: values,
                        backgroundColor: '#e74c3c', // Vermelho para destacar pontos críticos
                        borderColor: '#c0392b',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            title: { display: true, text: 'Porcentagem (%)' },
                            ticks: { callback: v => v + '%' } 
                        } 
                    }
                }
            });
        }

        updateDashboard();
    </script>
</body>
</html>
