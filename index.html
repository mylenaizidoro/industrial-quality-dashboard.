<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #1a2a3a; }
        .dashboard-container { max-width: 1200px; margin: auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .main-title { font-size: 24px; font-weight: 800; color: #2d3748; }
        .filter-group { display: flex; align-items: center; gap: 10px; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 14px; outline: none; cursor: pointer; }
        .charts-list { display: flex; flex-direction: column; gap: 30px; }
        .chart-card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
        .chart-title { font-weight: 700; color: #4a5568; font-size: 16px; margin-bottom: 15px; grid-column: span 2; text-transform: uppercase; }
        .chart-container { position: relative; height: 300px; }
        .comentario-lateral { padding: 15px; font-size: 13px; display: flex; align-items: center; font-weight: 500; border-radius: 6px; line-height: 1.4; }
        .purple-box { background-color: #f3f0ff; border-left: 4px solid #805ad5; color: #44337a; }
        .red-box { background-color: #fff5f5; border-left: 4px solid #e53e3e; color: #742a2a; }
        .green-box { background-color: #f0fff4; border-left: 4px solid #38a169; color: #22543d; }
        @media (max-width: 900px) { .chart-card { grid-template-columns: 1fr; } .chart-title { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-section">
        <h1 class="main-title">GESTÃO DE QUALIDADE CURITIBA</h1>
        <div class="filter-group">
            <label for="mesFiltro">Filtrar por Mês:</label>
            <select id="mesFiltro" onchange="processData()">
                <option value="todos">Todos os Meses</option>
            </select>
        </div>
    </div>

    <div class="charts-list">
        <div class="chart-card">
            <h2 class="chart-title">Ranking de Apontamentos por Inspetor</h2>
            <div class="chart-container"><canvas id="chartInspetores"></canvas></div>
            <div class="comentario-lateral purple-box">Produtividade individual baseada na Coluna B.</div>
        </div>

        <div class="chart-card">
            <h2 class="chart-title">Principais Defeitos Detectados</h2>
            <div class="chart-container"><canvas id="chartDefeitos"></canvas></div>
            <div class="comentario-lateral red-box">Códigos da Coluna G traduzidos para nomes técnicos.</div>
        </div>

        <div class="chart-card">
            <h2 class="chart-title">Volume Total de Peças Verificadas</h2>
            <div class="chart-container"><canvas id="chartPecas"></canvas></div>
            <div class="comentario-lateral green-box">Acumulado de peças inspecionadas por lote (Coluna F).</div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);

    const dic = {
        "17": "TECIDO DESCOLADO NAS BORDAS", "K9": "TECIDO COM RESÍDUOS DE COLA", "L7": "FRAME DESCOLADO MOLDURA", 
        "P5": "TECIDO COM RESÍDUOS DE COLA", "X7": "BLANK PERDIDO", "U3": "DEFORMAÇÃO DE BORDAS", "U4": "DEFORMAÇÃO DE SUPERFÍCIE",
        "A3": "PEÇA DEFORMADA", "B4": "PEÇA QUEBRADA", "D6": "PEÇA QUEIMADA", "C3": "PEÇA SUJA"
    };

    const mesesNome = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    let rawRows = [];

    async function loadCSV() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv";
        try {
            const resp = await fetch(url);
            const csvText = await resp.text();
            rawRows = csvText.split(/\r?\n/).slice(1);
            
            // Preencher o seletor de meses dinamicamente
            const mesesEncontrados = new Set();
            rawRows.forEach(row => {
                const cols = row.split(/[,;]/);
                const dataStr = cols[0]?.replace(/"/g, '').trim();
                if (dataStr) {
                    const mesIndex = parseInt(dataStr.split('/')[1]) - 1;
                    if (!isNaN(mesIndex)) mesesEncontrados.add(mesIndex);
                }
            });

            const select = document.getElementById('mesFiltro');
            Array.from(mesesEncontrados).sort().forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = mesesNome[m];
                select.appendChild(opt);
            });

            processData();
        } catch (err) { console.error(err); }
    }

    function processData() {
        const filtroMes = document.getElementById('mesFiltro').value;
        let inspetores = {}, defeitos = {}, pecas = {};

        rawRows.forEach(row => {
            const cols = row.split(/[,;]/);
            if (cols.length < 7) return;

            const dataStr = cols[0]?.replace(/"/g, '').trim();
            const mesIndex = parseInt(dataStr.split('/')[1]) - 1;

            // Filtro de Mês
            if (filtroMes !== "todos" && mesIndex != filtroMes) return;

            const inspetor = cols[1]?.replace(/"/g, '').trim().toUpperCase();
            const lote = cols[3]?.replace(/"/g, '').trim();
            const qtd = parseInt(cols[5]?.replace(/"/g, '').trim()) || 0;
            const defRaw = cols[6]?.replace(/"/g, '').trim();

            if (inspetor) inspetores[inspetor] = (inspetores[inspetor] || 0) + 1;
            if (lote) pecas[lote] = (pecas[lote] || 0) + qtd;

            if (defRaw && defRaw !== "0") {
                defRaw.split(/[\/,]+/).forEach(d => {
                    const dKey = d.replace(/"/g, '').trim().toUpperCase();
                    if (dKey) {
                        const nome = dic[dKey] || dKey;
                        defeitos[nome] = (defeitos[nome] || 0) + 1;
                    }
                });
            }
        });

        const sort = (obj) => Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, 8);

        render('chartInspetores', sort(inspetores), '#805ad5', 'y');
        render('chartDefeitos', sort(defeitos), '#e53e3e', 'y');
        render('chartPecas', sort(pecas), '#38a169', 'x');
    }

    function render(id, dataArr, color, axis) {
        const ctx = document.getElementById(id).getContext('2d');
        if (window[id + 'Obj']) window[id + 'Obj'].destroy();
        window[id + 'Obj'] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: dataArr.map(i => i[0]),
                datasets: [{ data: dataArr.map(i => i[1]), backgroundColor: color, borderRadius: 4 }]
            },
            options: {
                indexAxis: axis,
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false }, 
                    datalabels: { display: true, anchor: 'end', align: 'end', font: { weight: 'bold' } } 
                },
                scales: { x: { grid: { display: false } }, y: { grid: { display: false }, beginAtZero: true } }
            }
        });
    }

    loadCSV();
</script>
</body>
</html>
