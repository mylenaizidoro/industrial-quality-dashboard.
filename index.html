<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Qualidade | Mylena</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --red: #e74c3c; --blue: #3498db; --green: #27ae60; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        
        /* Cartões de KPI */
        .kpi-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid var(--blue); }
        .kpi-card h3 { margin: 0; font-size: 0.9rem; color: #7f8c8d; text-transform: uppercase; }
        .kpi-card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: bold; color: var(--dark); }

        .dashboard-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .header { border-bottom: 2px solid #eee; margin-bottom: 15px; padding-bottom: 10px; }
        h2 { margin: 0; font-size: 1.1rem; color: var(--dark); }
    </style>
</head>
<body>
    <div style="max-width: 1100px; margin: auto;">
        <!-- KPIs Rápidos -->
        <div class="kpi-container">
            <div class="kpi-card"><h3>Total Devolvido</h3><p id="totalQty">0</p></div>
            <div class="kpi-card" style="border-top-color: var(--red);"><h3>Produto Crítico</h3><p id="topProd" style="font-size: 1.2rem;">-</p></div>
            <div class="kpi-card" style="border-top-color: var(--green);"><h3>Principal Falha</h3><p id="topDefect" style="font-size: 1.2rem;">-</p></div>
        </div>

        <!-- Gráfico Principal: Pareto de Produtos -->
        <div class="dashboard-card">
            <div class="header"><h2>Top 5 Produtos com Mais Devoluções</h2></div>
            <canvas id="productChart" height="80"></canvas>
        </div>

        <!-- Gráfico de Detalhes: Motivos por Produto -->
        <div class="dashboard-card">
            <div class="header"><h2>Análise de Defeitos por Produto</h2></div>
            <canvas id="defectByProductChart" height="100"></canvas>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        Papa.parse(sheetUrl, {
            download: true,
            complete: function(results) {
                const rows = results.data.slice(1);
                let total = 0;
                const prodData = {};
                const defectCounts = {};

                rows.forEach(row => {
                    const prod = row[1];
                    const qty = parseFloat(row[3]) || 0;
                    const defect = row[10];

                    if (prod && qty > 0) {
                        total += qty;
                        // Soma por produto
                        prodData[prod] = (prodData[prod] || { total: 0, defects: {} });
                        prodData[prod].total += qty;
                        
                        // Soma por defeito (para o gráfico empilhado)
                        if(defect) {
                            prodData[prod].defects[defect] = (prodData[prod].defects[defect] || 0) + qty;
                            defectCounts[defect] = (defectCounts[defect] || 0) + qty;
                        }
                    }
                });

                // Ordenar para pegar o Top 5
                const sortedProds = Object.keys(prodData).sort((a,b) => prodData[b].total - prodData[a].total).slice(0, 5);
                const sortedDefects = Object.keys(defectCounts).sort((a,b) => defectCounts[b] - defectCounts[a]);

                // Atualizar KPIs
                document.getElementById('totalQty').innerText = total;
                document.getElementById('topProd').innerText = sortedProds[0] || "-";
                document.getElementById('topDefect').innerText = sortedDefects[0] || "-";

                // Renderizar Gráficos Simplificados
                renderSimpleChart(sortedProds, prodData);
                renderStackedChart(sortedProds, prodData, sortedDefects.slice(0, 6)); // Apenas os 6 defeitos mais comuns
            }
        });

        function renderSimpleChart(labels, dataObj) {
            new Chart(document.getElementById('productChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Qtd Total', data: labels.map(l => dataObj[l].total), backgroundColor: '#3498db' }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        function renderStackedChart(prods, dataObj, defectLabels) {
            const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6'];
            const datasets = defectLabels.map((d, i) => ({
                label: d,
                data: prods.map(p => dataObj[p].defects[d] || 0),
                backgroundColor: colors[i % colors.length]
            }));

            new Chart(document.getElementById('defectByProductChart'), {
                type: 'bar',
                data: { labels: prods, datasets: datasets },
                options: { scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }
    </script>
</body>
</html>
