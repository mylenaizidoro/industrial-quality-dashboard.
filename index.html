<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        .main-title { text-align: center; color: #2c3e50; margin: 10px 0; text-transform: uppercase; font-size: 24px; font-weight: bold; }
        @media print { .btn-export, .btn-plano, .btn-del { display: none; } }
        .btn-group { text-align: center; margin-bottom: 15px; }
        .btn-export { padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-plano { padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1200px; margin: auto; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { grid-column: span 2; }
        .header { text-align: center; color: #2c3e50; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; font-size: 16px; }
        
        .item-historico { background: #fff; border-left: 5px solid #27ae60; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .btn-del { cursor: pointer; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        #areaPlanoAcao { display:none; position:fixed; top:50px; left:10%; width:80%; background:white; padding:20px; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.5); z-index:1000; }
    </style>
</head>
<body>

<h1 class="main-title">INDICADORES DE QUALIDADE COPLAC CURITIBA</h1>
<div class="btn-group">
    <button class="btn-export" onclick="gerarPDF()">EXPORTAR PDF</button>
    <button class="btn-plano" onclick="abrirPlano()">PLANO DE AÇÃO</button>
</div>

<div id="areaPlanoAcao">
    <h2>PLANO DE AÇÃO - ANÁLISE DE DADOS</h2>
    <textarea id="textoPlano" style="width:100%; height:200px; padding:10px; border:1px solid #ccc;"></textarea>
    <div style="margin-top:15px; text-align:right;">
        <button onclick="fecharPlano()">FECHAR</button>
        <button onclick="salvarPlano()" style="background:#27ae60; color:white;">SALVAR</button>
    </div>
</div>

<div class="dashboard">
    <div class="container full-width"><canvas id="graficoPPM" height="120"></canvas></div>
    <div class="container"><canvas id="graficoDefeitos"></canvas></div>
    <div class="container"><canvas id="graficoSetor"></canvas></div>
    <div class="container full-width">
        <h2 class="header">RESUMO DO PLANO DE AÇÃO</h2>
        <div id="displayPlano"></div>
    </div>
</div>

<script>
    // Carrega ao abrir a página
    window.onload = carregarDados;

    function carregarDados() {
        const historico = JSON.parse(localStorage.getItem('planoAcaoCoplac') || "[]");
        const div = document.getElementById('displayPlano');
        div.innerHTML = "";
        
        if (historico.length === 0) {
            div.innerText = "Nenhuma análise salva.";
        } else {
            historico.forEach((item, index) => {
                const linha = document.createElement('div');
                linha.className = 'item-historico';
                linha.innerHTML = `<span>${item}</span> <button class="btn-del" onclick="deletar(${index})">EXCLUIR</button>`;
                div.appendChild(linha);
            });
        }
    }

    function salvarPlano() {
        const txt = document.getElementById('textoPlano').value;
        if (!txt) return alert("Digite algo!");
        
        const data = new Date().toLocaleDateString();
        const lista = JSON.parse(localStorage.getItem('planoAcaoCoplac') || "[]");
        lista.push(`[${data}] ${txt}`);
        
        localStorage.setItem('planoAcaoCoplac', JSON.stringify(lista));
        document.getElementById('textoPlano').value = "";
        carregarDados();
        fecharPlano();
    }

    function deletar(index) {
        const lista = JSON.parse(localStorage.getItem('planoAcaoCoplac') || "[]");
        lista.splice(index, 1);
        localStorage.setItem('planoAcaoCoplac', JSON.stringify(lista));
        carregarDados();
    }

    function abrirPlano() { document.getElementById('areaPlanoAcao').style.display = 'block'; }
    function fecharPlano() { document.getElementById('areaPlanoAcao').style.display = 'none'; }
    function gerarPDF() { window.print(); }

    // Gráficos (mantidos conforme original)
    const url = 'https://script.google.com/macros/s/AKfycbx5eihq6v75T79HB7HWhGfK23f4WSTsiE8cksqTlPCyuqLcFd88_KhYkvbBa5p7VCjLbA/exec';
    fetch(url).then(r => r.json()).then(data => {
        // ... (seu código de gráficos aqui)
    });
</script>
</body>
</html>
