<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PPM Curitiba - Dashboard de Qualidade</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .valor { font-size: 2em; font-weight: bold; color: #6a5acd; }
    </style>
</head>
<body>

    <h1>Qualidade - Unidade Curitiba</h1>
    <div class="card">
        <h3>PPM ATUAL (Mai/26)</h3>
        <p class="valor" id="ppm-valor">Carregando...</p>
    </div>

    <canvas id="meuGrafico" width="400" height="200"></canvas>

    <script>
        // Substitua pelo SEU link do Web App (o que termina em /exec)
        const url = 'https://script.google.com/macros/s/AKfycbwbAjpnaunGvkqpd-IPjvI7QtisgyLJspHiWgna4CK63W9ayvR1jaX-MaI7GYY3-xln4g/exec';

        fetch(url)
            .then(res => res.json())
            .then(data => {
                // 'data' é a matriz vinda do Google Sheets
                const valorPPM = data[1][12]; // Coluna 13 (mai-26) da linha 2 (PPM)
                document.getElementById('ppm-valor').innerText = valorPPM;

                // Configuração do Gráfico
                const ctx = document.getElementById('meuGrafico').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data[0].slice(1),
                        datasets: [{ label: 'PPM Realizado', data: data[1].slice(1), borderColor: '#6a5acd' }]
                    }
                });
            });
    </script>
</body>
</html>
