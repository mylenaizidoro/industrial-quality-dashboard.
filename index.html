<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        .main-title { text-align: center; color: #2c3e50; margin: 10px 0; text-transform: uppercase; font-size: 24px; font-weight: bold; }
        
        @media print { .btn-export { display: none; } }
        
        .btn-group { text-align: center; margin-bottom: 15px; }
        .btn-export { padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1200px; margin: auto; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; }
        .full-width { grid-column: span 2; }
        .header { text-align: center; color: #2c3e50; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; font-size: 16px; }

        /* Estilo da Lista (Checklist) */
        .lista-tarefas { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-add { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .tarefa-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #f0f0f0; }
        .btn-del { color: red; cursor: pointer; font-size: 12px; margin-left: auto; }
    </style>
</head>
<body>

<h1 class="main-title">INDICADORES DE QUALIDADE COPLAC CURITIBA</h1>

<div class="btn-group">
    <button class="btn-export" onclick="gerarPDF()">EXPORTAR PDF</button>
</div>

<div class="dashboard">
    <div class="container full-width">
        <h2 class="header">INDICADOR PPM INTERNO - ÚLTIMOS 12 MESES</h2>
        <canvas id="graficoPPM" height="100"></canvas>
    </div>

    <div class="container">
        <h2 class="header">AS PEÇAS QUE APRESENTARAM MAIS DEFEITOS NO MÊS</h2>
        <canvas id="graficoDefeitos"></canvas>
    </div>

    <div class="container">
        <h2 class="header">PPM POR SETOR</h2>
        <canvas id="graficoSetor"></canvas>
    </div>

    <div class="container full-width lista-tarefas">
        <h2 class="header">PLANO DE AÇÃO</h2>
        <div class="input-group">
            <input type="text" id="inputTarefa" placeholder="Digitar nova tarefa de entrada...">
            <button class="btn-add" onclick="adicionarTarefa()">+</button>
        </div>
        <div id="containerTarefas"></div>
    </div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbx5eihq6v75T79HB7HWhGfK23f4WSTsiE8cksqTlPCyuqLcFd88_KhYkvbBa5p7VCjLbA/exec';
    Chart.register(ChartDataLabels);

    // Carregar tarefas salvas ao iniciar
    window.onload = () => {
        const salvas = localStorage.getItem('planoAcaoCoplac');
        if (salvas) document.getElementById('containerTarefas').innerHTML = salvas;
    };

    function adicionarTarefa() {
        const input = document.getElementById('inputTarefa');
        if (input.value === "") return;
        
        const div = document.createElement('div');
        div.className = 'tarefa-item';
        div.innerHTML = `<input type="checkbox"> <span>${input.value}</span> <span class="btn-del" onclick="this.parentElement.remove(); salvarTarefas();">[x]</span>`;
        document.getElementById('containerTarefas').appendChild(div);
        
        input.value = "";
        salvarTarefas();
    }

    function salvarTarefas() {
        localStorage.setItem('planoAcaoCoplac', document.getElementById('containerTarefas').innerHTML);
    }

    // --- Lógica dos Gráficos ---
    fetch(url).then(r => r.json()).then(data => {
        new Chart(document.getElementById('graficoPPM').getContext('2d'), {
            type: 'bar',
            data: { labels: data.meses, datasets: [{ label: 'PPM', data: data.ppm, backgroundColor: data.ppm.map((v, i) => v <= data.meta[i] ? '#27ae60' : '#e74c3c') }, { label: 'META', data: data.meta, type: 'line', borderColor: '#c0392b', borderWidth: 2, datalabels: { display: false } }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { anchor: 'end', align: 'top', color: '#333', font: { size: 14, weight: 'bold' } } } }
        });

        new Chart(document.getElementById('graficoDefeitos').getContext('2d'), {
            type: 'bar',
            data: { labels: data.defeitos.map(d => d[0]), datasets: [{ label: 'Quantidade', data: data.defeitos.map(d => d[1]), backgroundColor: '#3498db' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { anchor: 'end', align: 'top', color: '#333', font: { size: 14, weight: 'bold' } } } }
        });

        new Chart(document.getElementById('graficoSetor').getContext('2d'), {
            type: 'doughnut',
            data: { labels: data.ppmPorSetor.map(d => d[0]), datasets: [{ data: data.ppmPorSetor.map(d => d[1]), backgroundColor: ['#3498db', '#e74c3c', '#27ae60', '#f1c40f', '#9b59b6', '#34495e', '#e67e22', '#1abc9c', '#7f8c8d', '#2ecc71', '#d35400'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { color: '#000000', font: { size: 14, weight: 'bold' } } } }
        });
    });

    function gerarPDF() {
        const opt = { margin: 2, filename: 'Dashboard_Qualidade_Coplac.pdf', html2canvas: { scale: 1.8 } };
        html2pdf().set(opt).from(document.body).save();
    }
</script>
</body>
</html>
