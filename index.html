<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PPM Interno - Relatório Técnico</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; padding: 20px; }
        .table-container { max-width: 1000px; margin: auto; background: white; padding: 10px; border: 1px solid #999; }
        
        /* Cabeçalho da Tabela */
        .titulo-tabela { background-color: #999; color: black; text-align: center; font-weight: bold; padding: 10px; border: 1px solid #000; }
        
        /* Estilo da Tabela */
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        
        /* Cores das Linhas (Iguais à foto) */
        .header-row { background-color: #fff; }
        .row-ppm { background-color: #a67c52; color: #000; }
        .row-meta { background-color: #fff; color: #000; }
        .row-produzido { background-color: #0ff; color: #000; font-weight: bold; }
        .row-refugo { background-color: #f00; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="table-container">
    <div class="titulo-tabela">PPM INTERNO</div>
    <table id="tabela-final">
        <thead>
            <tr id="meses" class="header-row"><th>MÊS</th></tr>
        </thead>
        <tbody>
            <tr id="ppm" class="row-ppm"><td>PPM</td></tr>
            <tr id="meta" class="row-meta"><td>META</td></tr>
            <tr id="produzido" class="row-produzido"><td>PRODUZIDO</td></tr>
            <tr id="refugo" class="row-refugo"><td>REFUGO</td></tr>
        </tbody>
    </table>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbzXzhiMJg9nAcFuSIX-jtBELHK5OcB9LWwXaxd1uN3hUUoQmIEc-BLI8zoIwSnWtFmDnA/exec';

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const meses = document.getElementById('meses');
            const ppm = document.getElementById('ppm');
            const meta = document.getElementById('meta');
            const prod = document.getElementById('produzido');
            const ref = document.getElementById('refugo');

            data.meses.forEach((m, i) => {
                meses.innerHTML += `<th>${m}</th>`;
                ppm.innerHTML += `<td>${data.ppm[i]}</td>`;
                meta.innerHTML += `<td>${data.meta[i]}</td>`;
                prod.innerHTML += `<td>${data.produzido[i]}</td>`;
                ref.innerHTML += `<td>${data.refugo[i]}</td>`;
            });
        });
</script>
</body>
</html>
