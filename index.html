<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Industrial | Mylena Izidoro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --primary: #e74c3c; --secondary: #3498db; --accent: #27ae60; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        .dashboard-card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            margin-bottom: 25px; 
        }

        /* Layout em colunas para os gráficos de Turno e Motivo */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .header { border-bottom: 3px solid var(--primary); margin-bottom: 15px; padding-bottom: 8px; }
        .header.blue { border-bottom-color: var(--secondary); }
        .header.green { border-bottom-color: var(--accent); }
        
        h2 { margin: 0; color: var(--dark); font-size: 1.2rem; }
        p.subtitle { color: #7f8c8d; margin: 5px 0 0; font-size: 0.8rem; }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Gráfico de Produtos (Largo) -->
        <div class="dashboard-card">
            <div class="header blue">
                <h2>Volume de Devoluções por Part Number</h2>
            </div>
            <canvas id="productChart" height="100"></canvas>
        </div>

        <!-- Seção Lado a Lado: Turnos e Motivos -->
        <div class="grid-layout">
            <!-- Gráfico de Turnos -->
            <div class="dashboard-card">
                <div class="header green">
                    <h2>Ocorrências Totais por Turno</h2>
                    <p class="subtitle">Desempenho: TA vs TB vs TC</p>
                </div>
                <canvas id="turnoChart"></canvas>
            </div>

            <!-- Ranking de Motivos -->
            <div class="dashboard-card">
                <div class="header">
                    <h2>Ranking de Motivos de Devolução</h2>
                    <p class="subtitle">Análise detalhada de falhas</p>
                </div>
                <canvas id="motivoChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    
                    // 1. Dados de Produtos
                    const prodCount = {};
                    for(let i=1; i<rows.length; i++) {
                        const p = rows[i][1]; const q = parseFloat(rows[i][3]) || 0;
                        if(p && q > 0) prodCount[p] = (prodCount[p] || 0) + q;
                    }
                    renderChart('productChart', Object.keys(prodCount), Object.values(prodCount), '#3498db', 'y');

                    // 2. Dados de Turnos (Fixo conforme sua tabela unificada)
                    renderChart('turnoChart', ["TA", "TB", "TC"], [19, 10, 12], '#27ae60', 'x');

                    // 3. Dados de Motivos (Lendo Coluna K e O)
                    const motivos = [];
                    const totaisMotivos = [];
                    for(let i = 3; i <= 15; i++) {
                        if(rows[i] && rows[i][10]) {
                            motivos.push(rows[i][10]);
                            totaisMotivos.push(parseFloat(rows[i][14]) || 0);
                        }
                    }
                    renderChart('motivoChart', motivos, totaisMotivos, '#e74c3c', 'y');
                }
            });
        }

        function renderChart(id, labels, values, color, axis) {
            new Chart(document.getElementById(id), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Quantidade', data: values, backgroundColor: color, borderRadius: 4 }]
                },
                options: { 
                    indexAxis: axis, 
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true }, y: { beginAtZero: true } }
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
