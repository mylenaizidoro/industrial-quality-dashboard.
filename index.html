<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; padding: 20px; }
        .box { width: 450px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"><canvas id="graficoMOD"></canvas></div>
        <div class="box"><canvas id="graficoMOI"></canvas></div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzSHsys-MDMovmUib_fI-BjHqTTgm4p3PcCyL6XtDCeF_mBIgUuAMjidaaoC29ZlGxV8Q/exec';

        async function carregar() {
            const res = await fetch(url);
            const dados = await res.json();
            
            // Pega apenas os meses únicos existentes nos dados
            const meses = [...new Set(dados.map(d => d.mes))];

            function desenhar(id, prefixo, titulo) {
                const categorias = ['1º TURNO', '2º TURNO', '3º TURNO', 'ADM'];
                
                const datasets = categorias.map((cat, i) => ({
                    label: cat,
                    data: meses.map(m => {
                        const item = dados.find(d => d.mes == m && d.categoria == `${prefixo} - ${cat}`);
                        return item ? item.qtd : 0;
                    }),
                    backgroundColor: ['#4472c4', '#ffc000', '#ed7d31', '#a5a5a5'][i]
                }));

                new Chart(document.getElementById(id), {
                    type: 'bar',
                    data: { labels: meses, datasets },
                    options: { 
                        plugins: { title: { display: true, text: titulo } }, 
                        scales: { y: { stacked: true } } 
                    }
                });
            }

            desenhar('graficoMOD', 'MOD', 'Turnover MOD');
            desenhar('graficoMOI', 'MOI', 'Turnover MOI');
        }
        carregar();
    </script>
</body>
</html>
