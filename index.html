<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Industrial | Mylena</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --primary: #e74c3c; --secondary: #3498db; --dark: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        .dashboard-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .header { border-bottom: 3px solid var(--secondary); margin-bottom: 15px; padding-bottom: 8px; }
        h2 { margin: 0; color: var(--dark); font-size: 1.1rem; text-transform: uppercase; }
        .ppm-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: center; }
        .ppm-table td { border: 1px solid #ddd; padding: 10px; font-weight: bold; }
        .row-label { background: #f8f9fa; text-align: left !important; width: 150px; }
        .bg-ppm { background: #FF9800; } .bg-meta { background: #4CAF50; color: white; }
        .bg-faturamento { background: #00BCD4; } .bg-devolucao { background: #F44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tabela PPM Diário -->
        <div class="dashboard-card" style="overflow-x: auto;">
            <div class="header" style="border-bottom-color: #FF9800;"><h2>PPM RETORNO PIC X FATURAMENTO DIÁRIO</h2></div>
            <table class="ppm-table" id="ppmTable"></table>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Ranking de Motivos (Correção da imagem image_77d233.png) -->
            <div class="dashboard-card">
                <div class="header" style="border-bottom-color: var(--primary);"><h2>Ranking de Motivos</h2></div>
                <canvas id="motivoChart"></canvas>
            </div>

            <!-- Gráfico de Produtos -->
            <div class="dashboard-card">
                <div class="header"><h2>Volume Total de Devoluções</h2></div>
                <canvas id="productChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        Chart.register(ChartDataLabels);
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    const dailyData = {};
                    const motivosRank = {};
                    const prodCount = {};

                    // Começamos em i=1 para pular o cabeçalho "Desc. Motivo"
                    for(let i = 1; i < rows.length; i++) {
                        const data = rows[i][0];
                        const prod = rows[i][1];
                        const fat = parseFloat(rows[i][2]) || 0;
                        const dev = parseFloat(rows[i][3]) || 0;
                        const motivo = rows[i][10]; // Coluna K

                        // Filtro para ignorar linhas de cabeçalho ou vazias
                        if (motivo && motivo !== "Desc. Motivo" && dev > 0) {
                            motivosRank[motivo] = (motivosRank[motivo] || 0) + dev;
                            prodCount[prod] = (prodCount[prod] || 0) + dev;
                        }

                        if(data && !isNaN(fat)) {
                            if(!dailyData[data]) dailyData[data] = { fat: 0, dev: 0 };
                            dailyData[data].fat += fat; dailyData[data].dev += dev;
                        }
                    }

                    renderPPMTable(dailyData);
                    renderMotivos(motivosRank);
                    renderProducts(prodCount);
                }
            });
        }

        function renderMotivos(dados) {
            const labels = Object.keys(dados).sort((a,b) => dados[b] - dados[a]);
            new Chart(document.getElementById('motivoChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ data: labels.map(l => dados[l]), backgroundColor: '#e74c3c' }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: {
                        legend: { display: false },
                        datalabels: { anchor: 'end', align: 'right', color: '#2c3e50', font: { weight: 'bold' } }
                    },
                    scales: { x: { beginAtZero: true, grid: { display: false } } }
                }
            });
        }

        function renderPPMTable(dailyData) {
            const table = document.getElementById('ppmTable');
            const dates = Object.keys(dailyData).slice(-7);
            let html = `<tr><td class="row-label">DIÁRIO</td>` + dates.map(d => `<td>${d}</td>`).join('') + `</tr>`;
            html += `<tr class="bg-ppm"><td class="row-label">PPM</td>` + dates.map(d => `<td>${((dailyData[d].dev / dailyData[d].fat) * 1000000 || 0).toFixed(0)}</td>`).join('') + `</tr>`;
            html += `<tr class="bg-meta"><td class="row-label">META</td>` + dates.map(() => `<td>3000</td>`).join('') + `</tr>`;
            html += `<tr class="bg-faturamento"><td class="row-label">FATURAMENTO</td>` + dates.map(d => `<td>${dailyData[d].fat}</td>`).join('') + `</tr>`;
            html += `<tr class="bg-devolucao"><td class="row-label">DEVOLUÇÃO PIC</td>` + dates.map(d => `<td>${dailyData[d].dev}</td>`).join('') + `</tr>`;
            table.innerHTML = html;
        }

        function renderProducts(dados) {
            const labels = Object.keys(dados).slice(0, 5);
            new Chart(document.getElementById('productChart'), {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: labels.map(l => dados[l]), backgroundColor: '#3498db' }] },
                options: { plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' } } } }
            });
        }

        initDashboard();
    </script>
</body>
</html>
