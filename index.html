<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teste DHO</title>
</head>

<body style="font-family:Arial;padding:30px">

<h1>Teste Apps Script</h1>

<button onclick="carregar()">Carregar Dados</button>

<pre id="resultado"></pre>

<script>

const URL="https://script.google.com/macros/s/AKfycbxrZm-K6S80aFtbXvMuPzMZD-Qvd6fTsc7bAzGRJzsSC0Zxqc7445IBAKvmbrhf1c6RTw/exec";

async function carregar(){

try{

const resposta=await fetch(URL);

const dados=await resposta.json();

document.getElementById("resultado").innerHTML=
JSON.stringify(dados,null,4);

}catch(e){

document.getElementById("resultado").innerHTML=e;

}

}

</script>

</body>
</html>
