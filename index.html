<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        
        .main-title { text-align: center; color: #2c3e50; margin: 10px 0; text-transform: uppercase; font-size: 24px; font-weight: bold; }
        
        @media print { .btn-export { display: none; } }
        .btn-export { display: block; margin: 0 auto 15px auto; padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1200px; margin: auto; }
        
        .container { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .full-width { grid-column: span 2; }
        
        .header { text-align: center; color: #2c3e50; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; font-size: 16px; }
        
        /* Ajuste de altura específico para dar respiro ao gráfico superior */
        #graficoPPM { max-height: 250px !important; }
        #graficoDefeitos, #graficoSetor { max-height: 300px !important; }
    </style>
</head>
<body>

<h1 class="main-title">INDICADORES DE QUALIDADE COPLAC CURITIBA</h1>
<button class="btn-export" onclick="gerarPDF()">EXPORTAR PDF</button>

<div class="dashboard">
    <div class="container full-width">
        <h2 class="header">INDICADOR PPM INTERNO - ÚLTIMOS 12 MESES</h2>
        <canvas id="graficoPPM" height="120"></canvas>
    </div>

    <div class="container">
        <h2 class="header">AS PEÇAS QUE APRESENTARAM MAIS PROBLEMAS</h2>
        <canvas id="graficoDefeitos"></canvas>
    </div>

    <div class="container">
        <h2 class="header">PPM POR SETOR</h2>
        <canvas id="graficoSetor"></canvas>
    </div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbx5eihq6v75T79HB7HWhGfK23f4WSTsiE8cksqTlPCyuqLcFd88_KhYkvbBa5p7VCjLbA/exec';
    Chart.register(ChartDataLabels);

    fetch(url).then(r => r.json()).then(data => {
        
        // 1. Gráfico PPM
        new Chart(document.getElementById('graficoPPM').getContext('2d'), {
            type: 'bar',
            data: {
                labels: data.meses,
                datasets: [
                    { label: 'PPM', data: data.ppm, backgroundColor: data.ppm.map((v, i) => v <= data.meta[i] ? '#27ae60' : '#e74c3c') },
                    { label: 'META', data: data.meta, type: 'line', borderColor: '#c0392b', borderWidth: 2, datalabels: { display: false } }
                ]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: { datalabels: { anchor: 'end', align: 'top', color: '#333', font: { size: 14, weight: 'bold' } } } 
            }
        });

        // 2. Gráfico Defeitos
        new Chart(document.getElementById('graficoDefeitos').getContext('2d'), {
            type: 'bar',
            data: {
                labels: data.defeitos.map(d => d[0]),
                datasets: [{ label: 'Quantidade', data: data.defeitos.map(d => d[1]), backgroundColor: '#3498db' }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { datalabels: { anchor: 'end', align: 'top', color: '#333', font: { size: 14, weight: 'bold' } } },
                scales: { x: { ticks: { color: '#000000', font: { size: 12, weight: 'bold' } } } }
            }
        });

        // 3. Gráfico Setor
        new Chart(document.getElementById('graficoSetor').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: data.ppmPorSetor.map(d => d[0]),
                datasets: [{
                    data: data.ppmPorSetor.map(d => d[1]),
                    backgroundColor: ['#3498db', '#e74c3c', '#27ae60', '#f1c40f', '#9b59b6', '#34495e', '#e67e22', '#1abc9c', '#7f8c8d', '#2ecc71', '#d35400']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    datalabels: { color: '#000000', font: { size: 14, weight: 'bold' } },
                    legend: { position: 'right', labels: { font: { size: 12, weight: 'bold' }, color: '#000000' } }
                }
            }
        });
    });

    function gerarPDF() {
        const btn = document.querySelector('.btn-export');
        btn.style.display = 'none';
        const opt = {
            margin: 2,
            filename: 'Indicadores_Qualidade_Coplac.pdf',
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 1.8, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(document.body).save().then(() => {
            btn.style.display = 'block';
        });
    }
</script>
</body>
</html>
