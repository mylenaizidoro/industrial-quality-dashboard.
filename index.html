<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
    <div style="width: 95%; margin: auto; padding: 20px;">
        <h1 style="text-align: center; color: #0b1c3d;">GESTÃO DE INDICADORES - DHO</h1>
        <canvas id="graficoTurnover"></canvas>
    </div>

<script>
    Chart.register(ChartDataLabels);
    // COLE A NOVA URL AQUI:
    const url = 'https://script.google.com/macros/s/AKfycbz5yhx_JiLJl39jtVSkTQQGXoRKbGRPqPNIF7REqRnRQyM3zqiyL75BDpH1ookSiUw7Uw/exec';

    async function carregar() {
        const res = await fetch(url);
        const dados = await res.json();
        
        // Extrai meses únicos. Se a chave for 'mes' (como no script), manteremos assim.
        const meses = [...new Set(dados.map(d => d.mes))];
        
        const getVal = (cat, m) => {
            const item = dados.find(d => d.mes === m && d.indicador === cat);
            return item ? parseFloat(item.valor) : 0;
        };

        new Chart(document.getElementById('graficoTurnover'), {
            type: 'bar',
            data: {
                labels: meses,
                datasets: [
                    { label: 'MOD 1º', data: meses.map(m => getVal('MOD - 1º TURNO', m)), backgroundColor: '#4472c4', stack: 'MOD' },
                    { label: 'ADM MOD', data: meses.map(m => getVal('ADM - MOD', m)), backgroundColor: '#a5a5a5', stack: 'MOD' }
                    // Adicione os outros datasets seguindo este padrão
                ]
            },
            options: {
                scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
            }
        });
    }
    carregar();
</script>
</body>
</html>
