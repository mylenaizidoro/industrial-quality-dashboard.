<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Qualidade Curitiba - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 20px; 
            color: #1a2a3a;
        }
        .dashboard-container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        .header-section { margin-bottom: 30px; text-align: left; }
        .main-title { font-size: 28px; font-weight: 800; text-transform: uppercase; margin: 0; }
        .sub-title { font-size: 14px; color: #555; margin-top: 5px; }

        /* Layout em lista (um embaixo do outro) */
        .charts-list { 
            display: flex;
            flex-direction: column;
            gap: 40px; 
        }

        .chart-card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid #edf2f7;
            display: grid;
            grid-template-columns: 1fr 250px; /* Gráfico largo e comentário estreito */
            gap: 20px;
        }

        .chart-title { 
            font-weight: 700; 
            color: #334155; 
            font-size: 18px; 
            margin-bottom: 15px; 
            grid-column: span 2; /* Título ocupa a largura toda */
        }

        .chart-container { position: relative; height: 300px; }

        /* Estilo do comentário lateral solicitado */
        .comentario-lateral {
            background-color: #fff5f5;
            border-left: 4px solid #e53e3e;
            padding: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            color: #742a2a;
            font-weight: 500;
        }

        @media (max-width: 800px) {
            .chart-card { grid-template-columns: 1fr; }
            .chart-title { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-section">
        <h1 class="main-title">GESTÃO DE QUALIDADE CURITIBA</h1>
        <div class="sub-title">Grupo Coplac | Performance</div>
    </div>

    <div class="charts-list">
        <!-- Indicador de Lotes -->
        <div class="chart-card">
            <h2 class="chart-title">QUANTIDADE APONTADA POR LOTE</h2>
            <div class="chart-container">
                <canvas id="chartLotes"></canvas>
            </div>
            <div class="comentario-lateral" style="border-left-color: #0081c9; background-color: #f0f7ff; color: #1e4e8c;">
                Frequência de registros por lote conforme apontamentos da planilha.
            </div>
        </div>

        <!-- Indicador de Defeitos -->
        <div class="chart-card">
            <h2 class="chart-title">DEFEITOS</h2>
            <div class="chart-container">
                <canvas id="chartDefeitos"></canvas>
            </div>
            <div class="comentario-lateral">
                Defeitos encontrados nas peças FIREWALL
            </div>
        </div>
    </div>
</div>

<script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv";

    async function atualizarDashboard() {
        try {
            const response = await fetch(urlCSV);
            const data = await response.text();
            const linhas = data.split('\n').slice(1);

            let contagemLotes = {};
            let contagemDefeitos = {};

            linhas.forEach(linha => {
                let col = linha.includes(';') ? linha.split(';') : linha.split(',');
                
                if (col.length > 6) {
                    // Lotes (Coluna D)
                    const lote = col[3]?.trim();
                    if (lote && lote.length > 5) {
                        contagemLotes[lote] = (contagemLotes[lote] || 0) + 1;
                    }

                    // Defeitos (Coluna G)
                    const defeitoRaw = col[6]?.trim(); 
                    if (defeitoRaw && defeitoRaw !== "0" && defeitoRaw.toLowerCase() !== "nenhum item") {
                        const lista = defeitoRaw.split(',');
                        lista.forEach(d => {
                            const dLimpo = d.trim();
                            if (dLimpo) contagemDefeitos[dLimpo] = (contagemDefeitos[dLimpo] || 0) + 1;
                        });
                    }
                }
            });

            const lotesOrd = Object.entries(contagemLotes).sort((a,b) => b[1]-a[1]).slice(0, 10);
            const defeitosOrd = Object.entries(contagemDefeitos).sort((a,b) => b[1]-a[1]).slice(0, 10);

            renderChart('chartLotes', lotesOrd.map(i => i[0]), lotesOrd.map(i => i[1]), '#0081c9');
            renderChart('chartDefeitos', defeitosOrd.map(i => i[0]), defeitosOrd.map(i => i[1]), '#e53e3e');

        } catch (e) { console.error(e); }
    }

    function renderChart(id, labels, data, color) {
        const ctx = document.getElementById(id).getContext('2d');
        if (window[id + 'Chart']) window[id + 'Chart'].destroy();
        window[id + 'Chart'] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ data: data, backgroundColor: color, borderRadius: 5 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: { ticks: { font: { weight: 'bold' } } }
                }
            }
        });
    }

    atualizarDashboard();
</script>
</body>
</html>
