<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico do Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2 style="text-align:center;">Verifique o Console (F12) para ver os dados!</h2>
<script>
    const url = 'https://script.google.com/macros/s/AKfycbx5FCrbLsR6WNM_mXAxAEK0W_j45MFh5voYJRnz7wRwob8m60d3ehYDjbXjnmUjZkKM3Q/exec';

    fetch(url)
        .then(response => response.json())
        .then(dados => {
            console.log("--- DADOS RECEBIDOS DA PLANILHA ---");
            console.log("Primeiro registro:", dados[0]);
            console.log("Chaves disponíveis:", Object.keys(dados[0]));
            alert("Verifique o console (F12)!");
        })
        .catch(err => console.error("Erro no fetch:", err));
</script>
</body>
</html>
