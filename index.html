<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Qualidade Curitiba - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 20px; 
            color: #1a2a3a;
        }
        .dashboard-container { 
            max-width: 1200px; 
            margin: auto; 
            background: white; 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        .header-section { margin-bottom: 30px; text-align: left; }
        .main-title { font-size: 28px; font-weight: 800; text-transform: uppercase; margin: 0; }
        .sub-title { font-size: 14px; color: #555; margin-top: 5px; }

        .button-bar { display: flex; gap: 10px; margin-bottom: 35px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
        .btn-blue { background-color: #0081c9; }
        .btn-purple { background-color: #8e54e9; }
        .btn-dark { background-color: #1a202c; }

        /* Layout em duas colunas para os gráficos */
        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
            margin-bottom: 30px;
        }
        .chart-card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #edf2f7; }
        .chart-title { font-weight: 700; color: #334155; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .chart-container { position: relative; height: 350px; }

        .detalhamento-box { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 12px; 
            border-left: 5px solid #8e54e9;
        }
        .detalhamento-box span { font-weight: bold; color: #0a192f; }

        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-section">
        <h1 class="main-title">GESTÃO DE QUALIDADE CURITIBA</h1>
        <div class="sub-title">Grupo Coplac | Performance</div>
    </div>

    <div class="button-bar">
        <button class="btn btn-blue">Atualizar Dados</button>
        <button class="btn btn-purple">✉ Enviar Indicadores</button>
        <button class="btn btn-dark">Exportar PDF</button>
    </div>

    <div class="charts-grid">
        <!-- Gráfico de Lotes -->
        <div class="chart-card">
            <h2 class="chart-title">Quantidade apontada por lote</h2>
            <div class="chart-container">
                <canvas id="chartLotes"></canvas>
            </div>
        </div>

        <!-- Gráfico de Defeitos -->
        <div class="chart-card">
            <h2 class="chart-title">Principais Defeitos Detectados</h2>
            <div class="chart-container">
                <canvas id="chartDefeitos"></canvas>
            </div>
        </div>
    </div>

    <div class="detalhamento-box">
        <p>Lote mais crítico: <span id="destaqueLote">...</span> | 
           Defeito mais frequente: <span id="destaqueDefeito" style="color:#e53e3e;">...</span> | 
           Total de registros: <span id="destaqueTotal">0</span></p>
    </div>
</div>

<script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv";

    async function atualizarDashboard() {
        try {
            const response = await fetch(urlCSV);
            const data = await response.text();
            const linhas = data.split('\n').slice(1);

            let contagemLotes = {};
            let contagemDefeitos = {};
            let totalGeral = 0;

            linhas.forEach(linha => {
                let col = linha.includes(';') ? linha.split(';') : linha.split(',');
                
                if (col.length > 6) {
                    // Lógica para Lotes (Coluna D)
                    const lote = col[3]?.trim();
                    if (lote && lote.length > 5) {
                        contagemLotes[lote] = (contagemLotes[lote] || 0) + 1;
                        totalGeral++;
                    }

                    // Lógica para Defeitos (Coluna G conforme image_2049b1.png)
                    const defeitoRaw = col[6]?.trim(); 
                    if (defeitoRaw && defeitoRaw !== "0" && defeitoRaw.toLowerCase() !== "nenhum item") {
                        // Trata casos como "F5,17" separando-os
                        const listaDefeitos = defeitoRaw.split(',');
                        listaDefeitos.forEach(d => {
                            const dLimpo = d.trim();
                            if (dLimpo) {
                                contagemDefeitos[dLimpo] = (contagemDefeitos[dLimpo] || 0) + 1;
                            }
                        });
                    }
                }
            });

            // Preparar dados de Lotes
            const lotesOrd = Object.entries(contagemLotes).sort((a,b) => b[1]-a[1]).slice(0, 8);
            // Preparar dados de Defeitos
            const defeitosOrd = Object.entries(contagemDefeitos).sort((a,b) => b[1]-a[1]).slice(0, 8);

            document.getElementById('destaqueTotal').innerText = totalGeral;
            if (lotesOrd[0]) document.getElementById('destaqueLote').innerText = lotesOrd[0][0];
            if (defeitosOrd[0]) document.getElementById('destaqueDefeito').innerText = defeitosOrd[0][0];

            // Renderizar Gráfico de Lotes
            renderChart('chartLotes', lotesOrd.map(i => i[0]), lotesOrd.map(i => i[1]), '#0081c9', 'Apontamentos');
            // Renderizar Gráfico de Defeitos
            renderChart('chartDefeitos', defeitosOrd.map(i => i[0]), defeitosOrd.map(i => i[1]), '#e53e3e', 'Ocorrências');

        } catch (e) { console.error(e); }
    }

    function renderChart(id, labels, data, color, labelName) {
        const ctx = document.getElementById(id).getContext('2d');
        if (window[id + 'Chart']) window[id + 'Chart'].destroy();
        window[id + 'Chart'] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ label: labelName, data: data, backgroundColor: color, borderRadius: 5 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 300000);
</script>
</body>
</html>
