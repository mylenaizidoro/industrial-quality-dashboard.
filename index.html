<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portal de DHO - Grupo Coplac</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#eef3f8;color:#071d3a}
.container{max-width:1300px;margin:40px auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:25px}
.card,.mini-card{background:white;border-radius:18px;padding:25px;box-shadow:0 4px 14px #0001}
.mini-card{text-align:center}
.mini-card p{font-size:24px;font-weight:bold}
.conteudo{display:grid;grid-template-columns:2.2fr 1fr;gap:35px;align-items:center}
.grafico-box{height:430px}
.detalhamento{background:#f6f9fd;border-left:6px solid #0ea5e9;border-radius:14px;padding:25px}
.verde{color:#10b981!important}
.vermelho{color:#f43f5e!important}
.erro{background:#ffe4e6;color:#9f1239;padding:15px;border-radius:12px;margin-bottom:20px;display:none}
</style>
</head>

<body>
<div class="container">

<div id="erro" class="erro"></div>

<div class="cards">
  <div class="mini-card"><h3>Último Resultado</h3><p id="ultimoResultado">--</p></div>
  <div class="mini-card"><h3>Meta</h3><p id="meta">--</p></div>
  <div class="mini-card"><h3>Status</h3><p id="status">--</p></div>
  <div class="mini-card"><h3>Melhor Mês</h3><p id="melhorMes">--</p></div>
</div>

<div class="card">
  <h1>ABSENTEÍSMO PA - 03</h1>
  <p>Grupo Coplac | Performance</p>

  <div class="conteudo">
    <div class="grafico-box">
      <canvas id="grafico"></canvas>
    </div>

    <div class="detalhamento">
      <h3>DETALHAMENTO</h3>
      <p>Horas Ausentes / Horas Programadas.</p>
      <p><b>Verde:</b> dentro da meta.</p>
      <p><b>Vermelho:</b> fora da meta.</p>
    </div>
  </div>
</div>

</div>

<script>
const URL_DADOS = "https://script.google.com/macros/s/AKfycbzM-06eBsqBEhyfad8jkC7p2dQhoJy_gXYO3niP7ts1D1nG4aXTpysctfNruigNcq84yw/exec";

function carregarDados(){
  const script = document.createElement("script");
  script.src = URL_DADOS + "?callback=receberDados";
  script.onerror = function(){
    mostrarErro("Erro ao conectar com o Apps Script.");
  };
  document.body.appendChild(script);
}

function receberDados(dados){
  if(!dados || dados.length === 0){
    mostrarErro("Nenhum dado veio da planilha.");
    return;
  }

  const abs = dados.filter(item =>
    String(item.processo || "").toUpperCase().includes("ABSENTEISMO") &&
    item.valorReal !== "" &&
    item.valorReal !== null &&
    item.valorReal !== undefined
  );

  if(abs.length === 0){
    mostrarErro("Não encontrei dados de ABSENTEISMO com valor real preenchido.");
    return;
  }

  const meses = abs.map(i => i.mes);
  const valores = abs.map(i => Number(String(i.valorReal).replace(",", ".")));
  const metas = abs.map(i => Number(String(i.objetivo).replace(",", ".")));

  const ultimo = valores[valores.length - 1];
  const metaAtual = metas[metas.length - 1];

  document.getElementById("ultimoResultado").innerText = fmt(ultimo) + "%";
  document.getElementById("meta").innerText = fmt(metaAtual) + "%";

  const status = document.getElementById("status");

  if(ultimo <= metaAtual){
    status.innerText = "Dentro";
    status.className = "verde";
  }else{
    status.innerText = "Fora";
    status.className = "vermelho";
  }

  const melhor = Math.min(...valores);
  const indice = valores.indexOf(melhor);
  document.getElementById("melhorMes").innerText = meses[indice] + " - " + fmt(melhor) + "%";

  montarGrafico(meses, valores, metas);
}

function montarGrafico(meses, valores, metas){
  const cores = valores.map((v,i) => v <= metas[i] ? "#10b981" : "#f43f5e");

  new Chart(document.getElementById("grafico"), {
    type: "bar",
    data: {
      labels: meses,
      datasets: [
        {
          label: "Realizado",
          data: valores,
          backgroundColor: cores,
          borderRadius: 8,
          barThickness: 24
        },
        {
          label: "Meta",
          data: metas,
          type: "line",
          borderColor: "#ff7a00",
          backgroundColor: "#ff7a00",
          borderWidth: 2,
          borderDash: [6,6],
          pointRadius: 4
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, suggestedMax: 9 },
        x: { ticks: { maxRotation: 60, minRotation: 60 } }
      }
    }
  });
}

function fmt(n){
  return Number(n).toFixed(2).replace(".", ",");
}

function mostrarErro(msg){
  const erro = document.getElementById("erro");
  erro.style.display = "block";
  erro.innerText = msg;
}

carregarDados();
</script>

</body>
</html>
