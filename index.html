<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de DHO - Turnover</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 40px; background-color: #f9f9f9; }
        .chart-container { width: 80%; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>

    <div class="chart-container">
        <h2>Turnover por Turno (MOD vs MOI)</h2>
        <canvas id="turnoverChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('turnoverChart').getContext('2d');
        const turnoverChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['MOD', 'MOI'],
                datasets: [
                    { label: '1º Turno', data: [1, 2], backgroundColor: '#4472c4' },
                    { label: '2º Turno', data: [6, 7], backgroundColor: '#ffc000' },
                    { label: '3º Turno', data: [5, 5], backgroundColor: '#ed7d31' },
                    { label: 'ADM', data: [2, 2], backgroundColor: '#a5a5a5' }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
