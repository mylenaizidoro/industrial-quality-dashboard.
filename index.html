<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PPM Interno - Relatório Técnico</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --border-color: #dee2e6;
            --header-bg: #343a40;
            --text-color: #212529;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); padding: 40px; color: var(--text-color); }
        .table-container { max-width: 1100px; margin: auto; background: white; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid var(--border-color); }
        
        .titulo-tabela { background-color: var(--header-bg); color: #ffffff; padding: 15px 20px; font-weight: 600; text-align: left; font-size: 1.1em; letter-spacing: 0.5px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: center; }
        
        thead th { background-color: #f1f3f5; font-weight: 700; color: #495057; }
        
        .row-ppm { background-color: #fffaf0; color: #856404; font-weight: 600; }
        .row-produzido { background-color: #e7f5ff; color: #1c7ed6; font-weight: 600; }
        .row-refugo { background-color: #fff5f5; color: #c92a2a; font-weight: 600; }
        
        tr:hover { background-color: #f8f9fa; transition: 0.2s; }
    </style>
</head>
<body>

<div class="table-container">
    <div class="titulo-tabela">PPM INTERNO - RELATÓRIO DE QUALIDADE</div>
    <table id="tabela-final">
        <thead><tr id="meses"><th>MÊS</th></tr></thead>
        <tbody>
            <tr id="ppm" class="row-ppm"><td>PPM</td></tr>
            <tr id="meta"><td>META</td></tr>
            <tr id="prod" class="row-produzido"><td>PRODUZIDO</td></tr>
            <tr id="ref" class="row-refugo"><td>REFUGO</td></tr>
        </tbody>
    </table>
</div>

<script>
    // URL do seu Web App (Verifique se é a versão mais recente após a Implantação)
    const url = 'https://script.google.com/macros/s/AKfycbzTHdWHlgjzInG4PEt2SLwhXrifRcCqQV-DFVauYf-0RgmNy6nqio192oXEg9ZPMuiqhg/exec';

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const meses = document.getElementById('meses');
            const ppm = document.getElementById('ppm');
            const meta = document.getElementById('meta');
            const prod = document.getElementById('prod');
            const ref = document.getElementById('ref');

            // Limpa antes de preencher para evitar duplicação em recarregamentos
            meses.innerHTML = '<th>MÊS</th>';
            ppm.innerHTML = '<td>PPM</td>';
            meta.innerHTML = '<td>META</td>';
            prod.innerHTML = '<td>PRODUZIDO</td>';
            ref.innerHTML = '<td>REFUGO</td>';

            data.meses.forEach((m, i) => {
                meses.innerHTML += `<th>${m}</th>`;
                ppm.innerHTML += `<td>${data.ppm[i]}</td>`;
                meta.innerHTML += `<td>${data.meta[i]}</td>`;
                prod.innerHTML += `<td>${data.produzido[i]}</td>`;
                ref.innerHTML += `<td>${data.refugo[i]}</td>`;
            });
        });
</script>
</body>
</html>
