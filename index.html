<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .box { width: 450px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="box"><canvas id="graficoMOD"></canvas></div>
    <div class="box"><canvas id="graficoMOI"></canvas></div>
</div>

<script>
    // A URL que você acabou de enviar
    const url = 'https://script.google.com/macros/s/AKfycbxXdmQtgnLzu2l73eYxoSKbFLWEr4-yVdGJH4osBdbFtIYuT9Olt_LpuxG043oIpLBKPw/exec';

    async function carregar() {
        const res = await fetch(url);
        const dados = await res.json();
        
        // Pega os meses únicos, ordenando pelo array original para manter a ordem cronológica
        const meses = [...new Set(dados.map(d => d.mes))];

        function desenhar(id, prefixo, titulo) {
            const turnos = ['1º TURNO', '2º TURNO', '3º TURNO', 'ADM'];
            const datasets = turnos.map((t, i) => ({
                label: t,
                data: meses.map(m => {
                    // Busca exata: "MOD - 1º TURNO" ou "MOI - 1º TURNO"
                    const nomeCat = (t === 'ADM') ? 'ADM' : (prefixo + ' - ' + t);
                    const item = dados.find(d => d.mes === m && d.categoria === nomeCat);
                    return item ? parseInt(item.qtd) : 0;
                }),
                backgroundColor: ['#4472c4', '#ffc000', '#ed7d31', '#a5a5a5'][i]
            }));

            new Chart(document.getElementById(id), {
                type: 'bar',
                data: { labels: meses, datasets },
                options: { 
                    plugins: { title: { display: true, text: titulo } },
                    scales: { y: { stacked: true, beginAtZero: true } }
                }
            });
        }

        desenhar('graficoMOD', 'MOD', 'Turnover MOD');
        desenhar('graficoMOI', 'MOI', 'Turnover MOI');
    }
    carregar();
</script>
</body>
</html>
