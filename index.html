<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turnover DHO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; }
        .container { width: 90%; margin: auto; padding: 30px; }
        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TURNOVER PA > 180 DIAS</h1>
        <canvas id="graficoTurnover" height="100"></canvas>
    </div>

<script>
    Chart.register(ChartDataLabels);
    const url = 'https://script.google.com/macros/s/AKfycbz5yhx_JiLJl39jtVSkTQQGXoRKbGRPqPNIF7REqRnRQyM3zqiyL75BDpH1ookSiUw7Uw/exec';

    async function carregar() {
        const res = await fetch(url);
        const dados = await res.json();
        const meses = [...new Set(dados.map(d => d.mes))];
        
        const getVal = (cat, m) => {
            const item = dados.find(d => d.mes === m && d.indicador === cat);
            return item ? parseFloat(item.valor) : 0;
        };
        const getObj = (m) => {
            const item = dados.find(d => d.mes === m && d.objetivo != null);
            return item ? parseFloat(item.objetivo) : 0;
        };

        new Chart(document.getElementById('graficoTurnover'), {
            type: 'bar',
            data: {
                labels: meses,
                datasets: [
                    { label: 'Realizado', data: meses.map(m => getVal('TURNOVER TOTAL', m)), backgroundColor: '#e91e63', borderRadius: 5 },
                    { label: 'Meta', data: meses.map(m => getObj(m)), type: 'line', borderColor: '#ff9800', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 4, pointBackgroundColor: '#ff9800' }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top', labels: { font: { size: 14, family: 'Segoe UI' } } },
                    datalabels: { 
                        color: '#000', 
                        anchor: 'end', 
                        align: 'top', 
                        font: { weight: 'bold', size: 12 },
                        formatter: (val) => val > 0 ? val + '%' : '' 
                    }
                },
                scales: { 
                    x: { grid: { display: false } }, 
                    y: { beginAtZero: true, max: 16, grid: { color: '#f0f0f0' } } 
                }
            }
        });
    }
    carregar();
</script>
</body>
</html>
