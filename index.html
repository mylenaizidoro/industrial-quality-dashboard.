<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Industrial | Mylena Izidoro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #e74c3c; 
            --secondary: #3498db; 
            --accent: #27ae60; 
            --purple: #8e44ad;
            --dark: #2c3e50; 
            --bg: #f4f7f6;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        .dashboard-card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); 
            margin-bottom: 25px; 
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .header { border-bottom: 3px solid var(--primary); margin-bottom: 15px; padding-bottom: 8px; }
        .header.blue { border-bottom-color: var(--secondary); }
        .header.green { border-bottom-color: var(--accent); }
        .header.purple { border-bottom-color: var(--purple); }
        
        h2 { margin: 0; color: var(--dark); font-size: 1.1rem; text-transform: uppercase; }
        p.subtitle { color: #7f8c8d; margin: 5px 0 0; font-size: 0.85rem; }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-card">
            <div class="header blue">
                <h2>Volume de Devoluções por Part Number</h2>
                <p class="subtitle">Visão geral da quantidade por produto</p>
            </div>
            <canvas id="productChart" height="80"></canvas>
        </div>

        <div class="dashboard-card">
            <div class="header purple">
                <h2>Defeitos por Tipo de Produto</h2>
                <p class="subtitle">Distribuição detalhada de falhas por Part Number (Empilhado)</p>
            </div>
            <canvas id="defectByProductChart" height="100"></canvas>
        </div>

        <div class="grid-layout">
            <div class="dashboard-card">
                <div class="header green">
                    <h2>Ocorrências Totais por Turno</h2>
                    <p class="subtitle">Desempenho: TA vs TB vs TC</p>
                </div>
                <canvas id="turnoChart"></canvas>
            </div>

            <div class="dashboard-card">
                <div class="header">
                    <h2>Ranking de Motivos de Devolução</h2>
                    <p class="subtitle">Análise das causas principais</p>
                </div>
                <canvas id="motivoChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    
                    const prodCount = {};
                    const productDefects = {}; 
                    const allDefectLabels = new Set();
                    
                    // Processamento dos dados da planilha
                    for(let i = 1; i < rows.length; i++) {
                        const prod = rows[i][1];  // Coluna B: Part Number
                        const qty = parseFloat(rows[i][3]) || 0; // Coluna D: Quantidade
                        const defect = rows[i][10]; // Coluna K: Motivo

                        if(prod && qty > 0) {
                            prodCount[prod] = (prodCount[prod] || 0) + qty;

                            if(defect) {
                                if(!productDefects[prod]) productDefects[prod] = {};
                                productDefects[prod][defect] = (productDefects[prod][defect] || 0) + qty;
                                allDefectLabels.add(defect);
                            }
                        }
                    }

                    // Renderização dos Gráficos
                    renderChart('productChart', Object.keys(prodCount), Object.values(prodCount), '#3498db', 'y');
                    renderStackedChart('defectByProductChart', productDefects, Array.from(allDefectLabels));
                    renderChart('turnoChart', ["TA", "TB", "TC"], [19, 10, 12], '#27ae60', 'x');

                    const motivos = [];
                    const totaisMotivos = [];
                    for(let i = 3; i <= 15; i++) {
                        if(rows[i] && rows[i][10]) {
                            motivos.push(rows[i][10]);
                            totaisMotivos.push(parseFloat(rows[i][14]) || 0);
                        }
                    }
                    renderChart('motivoChart', motivos, totaisMotivos, '#e74c3c', 'y');
                }
            });
        }

        function renderChart(id, labels, values, color, axis) {
            new Chart(document.getElementById(id), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Quantidade', data: values, backgroundColor: color, borderRadius: 4 }]
                },
                options: { 
                    indexAxis: axis, 
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true }, y: { beginAtZero: true } }
                }
            });
        }

        function renderStackedChart(id, dataObj, defectLabels) {
            const products = Object.keys(dataObj);
            const palette = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];

            const datasets = defectLabels.map((defect, index) => ({
                label: defect,
                data: products.map(p => dataObj[p][defect] || 0),
                backgroundColor: palette[index % palette.length]
            }));

            new Chart(document.getElementById(id), {
                type: 'bar',
                data: { labels: products, datasets: datasets },
                options: {
                    responsive: true,
                    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
