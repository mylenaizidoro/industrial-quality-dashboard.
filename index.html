<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Qualidade Industrial | Mylena Izidoro</title>
    
    <!-- Bibliotecas de Gráficos e Processamento de Dados -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary-color: #e74c3c; /* Vermelho para o PPM */
            --secondary-color: #3498db; /* Azul para os Produtos */
            --bg-color: #f4f7f6;
            --text-dark: #2c3e50;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 1000px; margin: auto; }

        .dashboard-card { 
            background: white; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            margin-bottom: 30px;
        }

        .header {
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header.blue { border-bottom-color: var(--secondary-color); }

        h2 { margin: 0; color: var(--text-dark); font-size: 1.4rem; }
        p.subtitle { color: #7f8c8d; margin-top: 5px; font-size: 0.85rem; }

        .stats-summary { display: flex; gap: 15px; margin-bottom: 20px; }

        .stat-badge {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GRÁFICO 1: TENDÊNCIA DE PPM -->
        <div class="dashboard-card">
            <div class="header">
                <h2>KPI: PPM Retorno PIC x Faturamento</h2>
                <p class="subtitle">Indicador de Qualidade e Meta Industrial</p>
            </div>
            <div class="stats-summary">
                <div class="stat-badge">META: 3.000 PPM</div>
                <div class="stat-badge" style="color: #27ae60;">STATUS: CONECTADO</div>
            </div>
            <canvas id="ppmChart"></canvas>
        </div>

        <!-- GRÁFICO 2: VOLUME POR PRODUTO -->
        <div class="dashboard-card">
            <div class="header blue">
                <h2>Volume de Devoluções por Produto</h2>
                <p class="subtitle">Rastreabilidade por Part Number (PN) e Código de Peça</p>
            </div>
            <canvas id="productChart"></canvas>
        </div>
    </div>

    <script>
        // Link CSV do seu Google Sheets (conforme image_850858.png)
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const rowsRaw = results.data.map(row => Object.values(row));

                    // 1. Lógica do Gráfico de PPM (Tendência Diária)
                    // Linha 28: DIARIO | Linha 29: PPM (conforme image_855ab1.png)
                    const labelsPPM = rowsRaw[28]?.slice(1, 8) || [];
                    const valoresPPM = rowsRaw[29]?.slice(1, 8).map(v => parseFloat(v.replace('.', '').replace(',', '.')) || 0) || [];
                    renderPpmChart(labelsPPM, valoresPPM);

                    // 2. Lógica do Gráfico de Produtos (Soma por Código)
                    // Coluna B: Produto | Coluna D: Quant. (conforme image_840ffe.png e image_840fbd.png)
                    const contagemProdutos = {};
                    data.forEach(row => {
                        const prod = row['Produto']; 
                        const quant = parseFloat(row['Quant.']) || 0;
                        if(prod && quant > 0) {
                            contagemProdutos[prod] = (contagemProdutos[prod] || 0) + quant;
                        }
                    });
                    renderProductChart(Object.keys(contagemProdutos), Object.values(contagemProdutos));
                }
            });
        }

        function renderPpmChart(labels, values) {
            new Chart(document.getElementById('ppmChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'PPM Real',
                        data: values,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Meta (3000)',
                        data: Array(labels.length).fill(3000),
                        borderColor: '#27ae60',
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                }
            });
        }

        function renderProductChart(labels, values) {
            new Chart(document.getElementById('productChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade Devolvida',
                        data: values,
                        backgroundColor: '#3498db',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y', // Barras horizontais conforme image_841078.png
                    responsive: true,
                    scales: { x: { beginAtZero: true } }
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
