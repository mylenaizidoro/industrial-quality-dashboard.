<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Qualidade Industrial | Mylena Izidoro</title>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary-color: #e74c3c; /* Vermelho Alerta (Padrão Industrial) */
            --secondary-color: #2c3e50;
            --bg-color: #f4f7f6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }

        .dashboard-card { 
            background: white; 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 1000px; 
        }

        .header {
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        h2 { margin: 0; color: var(--secondary-color); font-size: 1.5rem; }
        p.subtitle { color: #7f8c8d; margin-top: 5px; font-size: 0.9rem; }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value { font-weight: bold; font-size: 1.2rem; color: var(--primary-color); }
        .stat-label { font-size: 0.8rem; color: #95a5a6; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="header">
            <h2>KPI: PPM Retorno PIC x Faturamento Diário</h2>
            <p class="subtitle">Monitoramento de Qualidade Industrial - Rastreabilidade Automotiva</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">Meta PPM</div>
                <div class="stat-value">3.000</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Status do Sistema</div>
                <div class="stat-value" style="color: #27ae60;">Online</div>
            </div>
        </div>

        <!-- Área do Gráfico -->
        <canvas id="picChart"></canvas>
    </div>

    <script>
        // Link CSV configurado conforme image_850858.png
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    
                    // Lógica baseada na estrutura da image_855ab1.png:
                    // Linha 28: DIARIO (Datas)
                    // Linha 29: PPM
                    const datas = rows[28].slice(1, 8); // Ajustado para pegar as datas das colunas B a H
                    const valoresPPM = rows[29].slice(1, 8).map(v => {
                        // Limpeza de string para número (remove pontos e converte vírgula)
                        return parseFloat(v.replace('.', '').replace(',', '.')) || 0;
                    });

                    renderChart(datas, valoresPPM);
                }
            });
        }

        function renderChart(labels, values) {
            const ctx = document.getElementById('picChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'PPM Diário',
                        data: values,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#e74c3c',
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: 'Meta (3000)',
                        data: Array(labels.length).fill(3000),
                        borderColor: '#27ae60',
                        borderDash: [10, 5],
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Partes Por Milhão (PPM)' }
                        }
                    }
                }
            });
        }

        // Inicia o carregamento
        initDashboard();
    </script>
</body>
</html>
