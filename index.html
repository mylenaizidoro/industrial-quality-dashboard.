<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Qualidade - Coplac</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        .main-title { text-align: center; color: #2c3e50; margin: 10px 0; text-transform: uppercase; font-size: 24px; font-weight: bold; }
        
        .btn-export { display: block; margin: 0 auto 15px auto; padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1200px; margin: auto; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { grid-column: span 2; }
        
        .header { text-align: center; color: #2c3e50; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; font-size: 16px; }
        
        /* Ajustes de tamanho */
        #graficoPPM { max-height: 250px !important; }
        #graficoDefeitos, #graficoSetor { max-height: 300px !important; }

        /* Estilo do Campo de Plano de Ação */
        .plano-box { background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px; border-radius: 4px; display: flex; flex-direction: column; }
        textarea { width: 100%; height: 150px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; box-sizing: border-box; resize: none; }
        .btn-acao { margin-top: 10px; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<h1 class="main-title">INDICADORES DE QUALIDADE COPLAC CURITIBA</h1>
<button class="btn-export" onclick="gerarPDF()">EXPORTAR PDF</button>

<div class="dashboard">
    <div class="container full-width">
        <h2 class="header">INDICADOR PPM INTERNO - ÚLTIMOS 12 MESES</h2>
        <canvas id="graficoPPM"></canvas>
    </div>

    <div class="container">
        <h2 class="header">AS PEÇAS QUE APRESENTARAM MAIS DEFEITOS NO MÊS</h2>
        <canvas id="graficoDefeitos"></canvas>
    </div>

    <div class="container">
        <h2 class="header">PPM POR SETOR</h2>
        <canvas id="graficoSetor"></canvas>
    </div>

    <div class="container full-width">
        <h2 class="header">PLANO DE AÇÃO</h2>
        <div class="plano-box">
            <textarea id="textoPlano" placeholder="Escreva o plano de ação aqui..."></textarea>
            <button class="btn-acao" onclick="salvarPlano()">SALVAR E EXIBIR</button>
            <p id="exibirPlano" style="margin-top: 10px; font-style: italic; color: #555;"></p>
        </div>
    </div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbx5eihq6v75T79HB7HWhGfK23f4WSTsiE8cksqTlPCyuqLcFd88_KhYkvbBa5p7VCjLbA/exec';
    Chart.register(ChartDataLabels);

    fetch(url).then(r => r.json()).then(data => {
        // Gráfico PPM
        new Chart(document.getElementById('graficoPPM').getContext('2d'), {
            type: 'bar',
            data: { labels: data.meses, datasets: [{ label: 'PPM', data: data.ppm, backgroundColor: '#e74c3c' }, { label: 'META', data: data.meta, type: 'line', borderColor: '#c0392b' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Gráfico Defeitos
        new Chart(document.getElementById('graficoDefeitos').getContext('2d'), {
            type: 'bar',
            data: { labels: data.defeitos.map(d => d[0]), datasets: [{ label: 'Quantidade', data: data.defeitos.map(d => d[1]), backgroundColor: '#3498db' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Gráfico Setor (Pizza)
        new Chart(document.getElementById('graficoSetor').getContext('2d'), {
            type: 'doughnut',
            data: { labels: data.ppmPorSetor.map(d => d[0]), datasets: [{ data: data.ppmPorSetor.map(d => d[1]), backgroundColor: ['#3498db', '#e74c3c', '#27ae60', '#f1c40f', '#9b59b6'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    });

    function salvarPlano() {
        document.getElementById('exibirPlano').innerText = "Última Ação: " + document.getElementById('textoPlano').value;
    }

    function gerarPDF() {
        window.print();
    }
</script>
</body>
</html>
