<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Industrial - Mylena</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .dashboard-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin-bottom: 30px; max-width: 1000px; margin: auto; }
        .header { border-bottom: 3px solid #3498db; margin-bottom: 20px; padding-bottom: 10px; }
        h2 { margin: 0; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <div class="header">
            <h2>Volume de Devoluções por Produto</h2>
            <p>Rastreabilidade por Código de Peça e Quantidade</p>
        </div>
        <canvas id="productChart"></canvas>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    const contagemProdutos = {};

                    // Começamos na linha 1 para pular o cabeçalho
                    for (let i = 1; i < rows.length; i++) {
                        const linha = rows[i];
                        
                        // Pegamos os dados pela POSIÇÃO da coluna:
                        // Coluna B é o índice [1] | Coluna D é o índice [3]
                        const prod = linha[1]; 
                        const quant = parseFloat(linha[3]) || 0;

                        if (prod && quant > 0) {
                            contagemProdutos[prod] = (contagemProdutos[prod] || 0) + quant;
                        }
                    }

                    renderProductChart(Object.keys(contagemProdutos), Object.values(contagemProdutos));
                }
            });
        }

        function renderProductChart(labels, values) {
            new Chart(document.getElementById('productChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade Devolvida',
                        data: values,
                        backgroundColor: '#3498db',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: { x: { beginAtZero: true } }
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
