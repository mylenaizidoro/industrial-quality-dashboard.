<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Qualidade | Mylena Izidoro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #e74c3c; --secondary: #3498db; --accent: #27ae60; 
            --dark: #2c3e50; --bg: #f4f7f6;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        .dashboard-card { 
            background: white; border-radius: 12px; padding: 20px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); margin-bottom: 25px; 
        }

        .header { border-bottom: 3px solid var(--secondary); margin-bottom: 15px; padding-bottom: 8px; }
        h2 { margin: 0; color: var(--dark); font-size: 1.1rem; text-transform: uppercase; }
        
        /* Estilização da Tabela PPM */
        .ppm-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .ppm-table td, .ppm-table th { border: 1px solid #ddd; padding: 10px; text-align: center; font-weight: bold; }
        .row-label { background: #f8f9fa; text-align: left !important; width: 150px; }
        .bg-ppm { background: #FF9800; color: black; } /* Laranja */
        .bg-meta { background: #4CAF50; color: white; } /* Verde */
        .bg-faturamento { background: #00BCD4; color: black; } /* Ciano */
        .bg-devolucao { background: #F44336; color: white; } /* Vermelho */

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1. Tabela de PPM Diário (Estilo sua imagem) -->
        <div class="dashboard-card" style="overflow-x: auto;">
            <div class="header" style="border-bottom-color: #FF9800;">
                <h2>PPM RETORNO PIC X FATURAMENTO DIÁRIO</h2>
            </div>
            <table class="ppm-table" id="ppmTable">
                <!-- Preenchido via JS -->
            </table>
        </div>

        <!-- 2. Gráfico de Defeitos por Produto -->
        <div class="dashboard-card">
            <div class="header" style="border-bottom-color: #8e44ad;">
                <h2>Defeitos por Part Number</h2>
            </div>
            <canvas id="defectByProductChart" height="100"></canvas>
        </div>

        <div class="grid-layout">
            <!-- 3. Volume Geral por Produto -->
            <div class="dashboard-card">
                <div class="header">
                    <h2>Volume Total de Devoluções</h2>
                </div>
                <canvas id="productChart"></canvas>
            </div>

            <!-- 4. Ranking de Motivos -->
            <div class="dashboard-card">
                <div class="header" style="border-bottom-color: var(--primary);">
                    <h2>Ranking de Motivos</h2>
                </div>
                <canvas id="motivoChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7auqmo6fOoCEkoeoZ70TVM4ljEPsBlPfKBebWUbdWpb0URnI-ttwP2AlUNG4yHW7GLqkyLXXTo1Pm/pub?gid=536102353&single=true&output=csv';

        async function initDashboard() {
            Papa.parse(sheetUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    const dailyData = {};
                    const prodData = {};
                    const defectLabels = new Set();
                    const motivosRank = {};

                    // Processamento de dados (Inicia em 1 para pular cabeçalho)
                    for(let i = 1; i < rows.length; i++) {
                        const data = rows[i][0];       // Coluna A: Data
                        const prod = rows[i][1];       // Coluna B: Produto
                        const faturamento = parseFloat(rows[i][2]) || 0; // Coluna C: Fat
                        const devolucao = parseFloat(rows[i][3]) || 0;   // Coluna D: Dev
                        const defect = rows[i][10];    // Coluna K: Motivo

                        // Lógica para Tabela PPM
                        if(data) {
                            if(!dailyData[data]) dailyData[data] = { fat: 0, dev: 0 };
                            dailyData[data].fat += faturamento;
                            dailyData[data].dev += devolucao;
                        }

                        // Lógica para Gráficos de Produto/Defeitos
                        if(prod && devolucao > 0) {
                            if(!prodData[prod]) prodData[prod] = { total: 0, defects: {} };
                            prodData[prod].total += devolucao;
                            
                            if(defect) {
                                prodData[prod].defects[defect] = (prodData[prod].defects[defect] || 0) + devolucao;
                                defectLabels.add(defect);
                                motivosRank[defect] = (motivosRank[defect] || 0) + devolucao;
                            }
                        }
                    }

                    renderPPMTable(dailyData);
                    renderProductCharts(prodData, Array.from(defectLabels));
                    renderMotivoChart(motivosRank);
                }
            });
        }

        function renderPPMTable(dailyData) {
            const table = document.getElementById('ppmTable');
            const dates = Object.keys(dailyData).slice(-7); // Últimos 7 dias
            const meta = 3000;

            let html = `<tr><td class="row-label">DIÁRIO</td>` + dates.map(d => `<td>${d}</td>`).join('') + `</tr>`;
            
            // Linha PPM
            html += `<tr class="bg-ppm"><td class="row-label">PPM</td>` + dates.map(d => {
                const ppm = dailyData[d].fat > 0 ? ((dailyData[d].dev / dailyData[d].fat) * 1000000).toFixed(0) : 0;
                return `<td>${Number(ppm).toLocaleString()}</td>`;
            }).join('') + `</tr>`;

            // Linha META
            html += `<tr class="bg-meta"><td class="row-label">META</td>` + dates.map(() => `<td>${meta}</td>`).join('') + `</tr>`;

            // Linha FATURAMENTO
            html += `<tr class="bg-faturamento"><td class="row-label">FATURAMENTO</td>` + dates.map(d => `<td>${dailyData[d].fat}</td>`).join('') + `</tr>`;

            // Linha DEVOLUÇÃO
            html += `<tr class="bg-devolucao"><td class="row-label">DEVOLUÇÃO PIC</td>` + dates.map(d => `<td>${dailyData[d].dev}</td>`).join('') + `</tr>`;

            table.innerHTML = html;
        }

        function renderProductCharts(prodData, labels) {
            const prods = Object.keys(prodData).slice(0, 8); // Top 8 produtos
            
            // Gráfico Simples
            new Chart(document.getElementById('productChart'), {
                type: 'bar',
                data: {
                    labels: prods,
                    datasets: [{ label: 'Qtd Devolvida', data: prods.map(p => prodData[p].total), backgroundColor: '#3498db' }]
                }
            });

            // Gráfico Empilhado (Defeitos por Produto)
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22'];
            const datasets = labels.slice(0, 6).map((defect, i) => ({
                label: defect,
                data: prods.map(p => prodData[p].defects[defect] || 0),
                backgroundColor: colors[i]
            }));

            new Chart(document.getElementById('defectByProductChart'), {
                type: 'bar',
                data: { labels: prods, datasets: datasets },
                options: { scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        function renderMotivoChart(motivosRank) {
            const labels = Object.keys(motivosRank).sort((a,b) => motivosRank[b] - motivosRank[a]);
            new Chart(document.getElementById('motivoChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ data: labels.map(l => motivosRank[l]), backgroundColor: '#e74c3c' }]
                },
                options: { indexAxis: 'y', plugins: { legend: { display: false } } }
            });
        }

        initDashboard();
    </script>
</body>
</html>
