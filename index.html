<script>
    Chart.register(ChartDataLabels);

    // ... (restante do seu código igual até a parte de datalabels) ...

    datalabels: {
        color: function(context) {
            // Preto para o acumulado no topo, Branco para os valores dentro das barras
            let dataset = context.chart.data.datasets;
            let lastDatasetIndex = -1;
            dataset.forEach((ds, index) => {
                if (ds.stack === context.dataset.stack) lastDatasetIndex = index;
            });
            return (context.datasetIndex === lastDatasetIndex) ? 'black' : 'white';
        },
        anchor: function(context) {
            let dataset = context.chart.data.datasets;
            let lastDatasetIndex = -1;
            dataset.forEach((ds, index) => {
                if (ds.stack === context.dataset.stack) lastDatasetIndex = index;
            });
            return (context.datasetIndex === lastDatasetIndex) ? 'end' : 'center';
        },
        align: function(context) {
            let dataset = context.chart.data.datasets;
            let lastDatasetIndex = -1;
            dataset.forEach((ds, index) => {
                if (ds.stack === context.dataset.stack) lastDatasetIndex = index;
            });
            return (context.datasetIndex === lastDatasetIndex) ? 'top' : 'center';
        },
        font: { weight: 'bold' },
        formatter: function(value, context) {
            let dataset = context.chart.data.datasets;
            let currentStack = context.dataset.stack;
            
            // 1. Calcula o total acumulado daquela pilha (stack)
            let sum = 0;
            dataset.forEach(ds => {
                if (ds.stack === currentStack) {
                    sum += ds.data[context.dataIndex];
                }
            });

            // 2. Identifica o último dataset da pilha
            let lastDatasetIndex = -1;
            dataset.forEach((ds, index) => {
                if (ds.stack === currentStack) lastDatasetIndex = index;
            });

            // 3. Se for o último, retorna o acumulado. Se não, retorna o valor do próprio segmento.
            if (context.datasetIndex === lastDatasetIndex) {
                return sum > 0 ? sum : null; 
            } else {
                return value > 0 ? value : null;
            }
        }
    }
    // ... (restante das opções) ...
</script>
